<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>UpGames · Anuncio</title>
<!--
  Anuncio publicitario de UpGames (vertical 1080×1920, 30 fps, sin audio).
  Todo se calcula en render(t) a partir del tiempo: cada fotograma es exacto y
  render.js lo graba cuadro a cuadro con ffmpeg. Abre este archivo en Chrome y
  añade ?t=12.5 para ver un instante, o ?play para verlo en tiempo real.
  Los tiempos de cada escena están en T (ajústalos a la locución final).
-->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=block" rel="stylesheet">
<style>
:root { --g: #39FF88; --g2: #1FAF5E; --w: #F2F5F7; --gr: #8A94A6; --gr2: #4A5361; --bg: #03060C; --navy: #07101F; --rojo: #FF3B4E; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: 'Rajdhani', sans-serif; color: var(--w); }
#bg { position: absolute; inset: 0; }
.capa { position: absolute; inset: 0; will-change: opacity, transform; }
.c { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; }
.orb { font-family: 'Orbitron', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; }
.mono { font-family: 'Share Tech Mono', monospace; }
.glow { text-shadow: 0 0 18px rgba(57,255,136,.75), 0 0 46px rgba(57,255,136,.35); }
.verde { color: var(--g); }
.bisel { clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 26px 100%, 0 calc(100% - 26px)); }
.bisel-s { clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
.hex { clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }

/* Tarjeta del juego */
.juego { width: 540px; height: 720px; background: linear-gradient(170deg, #0E1A2E, #050A14); border: 3px solid rgba(138,148,166,.5); }
.juego .arte { position: absolute; left: 22px; right: 22px; top: 22px; height: 470px; overflow: hidden; background: linear-gradient(180deg, #06142A 0%, #0B2A3A 55%, #04101C 100%); }
.juego .tit { position: absolute; left: 30px; right: 30px; top: 512px; font-size: 54px; }
.juego .sub { position: absolute; left: 30px; top: 582px; font-size: 30px; color: var(--gr); letter-spacing: .2em; }
.juego .est { position: absolute; left: 30px; top: 628px; font-size: 40px; letter-spacing: 6px; color: var(--gr2); }

.etiqueta { padding: 18px 30px; font-size: 44px; font-weight: 700; background: #1A1F28; color: var(--w); border: 3px solid var(--gr); white-space: nowrap; letter-spacing: .02em; }
.sello { font-size: 120px; color: var(--rojo); border: 12px solid var(--rojo); padding: 6px 34px; letter-spacing: .06em; font-family: 'Orbitron'; font-weight: 900; }

/* Teléfono */
.tel { width: 600px; height: 1240px; border-radius: 74px; background: #0B0F16; padding: 22px; box-shadow: 0 0 0 4px #2A313C, 0 40px 120px rgba(0,0,0,.8); }
.tel .pant { position: relative; width: 100%; height: 100%; border-radius: 56px; overflow: hidden; background: var(--bg); }
.tel .notch { position: absolute; left: 50%; top: 18px; width: 150px; height: 40px; border-radius: 22px; background: #000; transform: translateX(-50%); z-index: 20; }
.tel.neon { box-shadow: 0 0 0 4px var(--g), 0 0 60px rgba(57,255,136,.45), 0 40px 120px rgba(0,0,0,.8); }

.ui-hdr { position: absolute; left: 0; right: 0; top: 0; height: 150px; padding: 78px 34px 0; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid rgba(57,255,136,.4); background: rgba(3,6,12,.9); }
.ui-logo { font-family: 'Orbitron'; font-weight: 900; font-size: 40px; letter-spacing: .06em; }
.ui-logo b { color: var(--g); text-shadow: 0 0 12px rgba(57,255,136,.8); font-weight: 900; }

.pop { position: absolute; width: 470px; padding: 20px 22px; background: #E9ECF0; color: #1A1F28; border-radius: 10px; font-size: 30px; font-weight: 700; box-shadow: 0 16px 40px rgba(0,0,0,.6); }
.pop i { display: block; font-style: normal; margin-top: 10px; padding: 12px; text-align: center; background: #9AA3B0; color: #fff; border-radius: 6px; font-size: 26px; }
.burbuja { position: absolute; padding: 18px 26px; border-radius: 26px; background: #1C222C; border: 2px solid #3A4250; font-size: 36px; font-weight: 600; white-space: nowrap; }

.pilar { width: 800px; height: 230px; background: rgba(12,20,34,.9); border: 3px solid rgba(57,255,136,.55); display: flex; align-items: center; gap: 40px; padding: 0 50px; }
.pilar .ic { width: 140px; height: 140px; display: grid; place-items: center; background: rgba(57,255,136,.12); }
.pilar .ic svg { width: 84px; height: 84px; }
.pilar .tx { position: relative; flex: 1; height: 100px; }
.pilar .tx span { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-size: 64px; white-space: nowrap; }

.pill { padding: 26px 40px; font-size: 46px; font-weight: 700; background: rgba(57,255,136,.08); border: 3px solid var(--g); color: var(--w); white-space: nowrap; letter-spacing: .03em; }
.pill b { color: var(--g); margin-right: 16px; font-family: 'Share Tech Mono'; }

.bloque { padding: 26px 34px; font-size: 46px; font-weight: 700; background: #20262F; border: 3px solid #4A5361; color: #C9CED6; white-space: nowrap; }
.fragmento { position: absolute; background: #2A313C; border: 2px solid #59616E; }

.cat { position: absolute; width: 240px; height: 200px; background: rgba(12,20,34,.95); border: 3px solid #2A3442; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 32px; font-weight: 700; letter-spacing: .06em; }
.cat svg { width: 66px; height: 66px; }

.moneda { position: absolute; width: 96px; height: 106px; background: linear-gradient(160deg, #6BFFAA, #1FAF5E); display: grid; place-items: center; font-family: 'Orbitron'; font-weight: 900; font-size: 30px; color: #02140A; }

.noti { position: absolute; left: 26px; right: 26px; height: 150px; background: rgba(20,30,46,.96); border: 2px solid rgba(57,255,136,.35); border-radius: 28px; padding: 22px 26px; display: flex; gap: 22px; align-items: center; }
.noti .av { width: 96px; height: 106px; flex-shrink: 0; display: grid; place-items: center; font-size: 46px; background: linear-gradient(160deg, #39FF88, #136B3A); }
.noti b { display: block; font-size: 32px; } .noti small { font-size: 27px; color: var(--gr); }

.chat { position: absolute; left: 22px; max-width: 470px; padding: 12px 18px; background: rgba(0,0,0,.55); border-radius: 18px; font-size: 27px; font-weight: 600; }
.chat b { color: var(--g); margin-right: 8px; }

.tarjeta-r { position: absolute; width: 300px; height: 130px; background: #141A24; border: 2px solid #3A4250; display: flex; gap: 16px; align-items: center; padding: 14px; }
.tarjeta-r .mini { width: 100px; height: 100px; flex-shrink: 0; }
.tarjeta-r b { font-size: 28px; } .tarjeta-r small { display: block; font-size: 22px; color: var(--gr); font-family: 'Share Tech Mono'; }

.creador { position: absolute; width: 168px; height: 196px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.creador .hx { width: 128px; height: 142px; display: grid; place-items: center; font-family: 'Orbitron'; font-weight: 900; font-size: 50px; color: #02140A; }
.creador small { font-family: 'Share Tech Mono'; font-size: 22px; color: var(--gr); }

.barra-url { width: 900px; height: 150px; background: #0C1424; border: 4px solid var(--g); display: flex; align-items: center; gap: 26px; padding: 0 44px; font-size: 70px; box-shadow: 0 0 50px rgba(57,255,136,.35); }
.cursor { display: inline-block; width: 6px; height: 70px; background: var(--g); vertical-align: middle; margin-left: 6px; }
.boton { padding: 34px 66px; background: var(--g); color: #02140A; font-family: 'Orbitron'; font-weight: 900; font-size: 50px; letter-spacing: .05em; }

#glitch { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
#glitch div { position: absolute; left: 0; right: 0; background: rgba(57,255,136,.18); mix-blend-mode: screen; }
#scan { position: absolute; inset: 0; z-index: 60; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 5px); }
#vigneta { position: absolute; inset: 0; z-index: 61; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }
#barrido { position: absolute; left: 0; right: 0; height: 6px; z-index: 62; background: linear-gradient(90deg, transparent, #39FF88 20%, #fff 50%, #39FF88 80%, transparent); box-shadow: 0 0 30px 8px rgba(57,255,136,.55); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="glitch"></div>
  <div id="barrido"></div>
  <div id="scan"></div>
  <div id="vigneta"></div>
</div>
<script>
'use strict';
/* ── Tiempos (segundos) — cada escena sigue una frase del guion ── */
const T = {   // sincronizado con la locución (ElevenLabs, 81,5 s)
  s1: 0,      // "¿Creaste un juego increíble…" 0.00
  s2: 7.2,    // "¿O eres creador…" 7.44
  s3: 14.3,   // "Sabemos que publicar…" 14.46
  s4: 23.4,   // "Y si te dijera…" 23.54
  s5: 30.95,  // "¡Eso es UpGames!" 31.10
  s6: 38.2,   // "Olvídate…" 38.32
  s7: 42.75,  // "Aquí tienes…" 42.88
  s8: 49.55,  // "Monetiza…" 49.68
  s9: 53.9,   // "Además, nunca más…" 54.06
  vivo: 59.8, // "Transmite en vivo" 60.06
  s10: 63.0,  // "…organice y posicione…" 63.14
  s11: 67.5,  // "Únete…" 67.70
  s12: 70.7,  // "¿Qué esperas…" 70.90
  s13: 74.8,  // "Entra a upgames.games…" 74.98
  fin: 78.9,  // "…y empieza a ganar hoy mismo" 79.36
  total: 84.5,
};
window.DURACION = T.total;

/* ── Utilidades ── */
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: k => k,
  out: k => 1 - Math.pow(1 - k, 3),
  out5: k => 1 - Math.pow(1 - k, 5),
  in: k => k * k * k,
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  back: k => { const c = 1.9, c3 = c + 1; return 1 + c3 * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  elas: k => k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
const P = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function h(tag, cls, html, padre) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (padre || stage).appendChild(e); return e; }
// Posiciona un elemento centrado (.c): desplazamiento, escala, rotación, opacidad
function pon(e, { x = 0, y = 0, s = 1, r = 0, o = 1, f = null, sx = null } = {}) {
  e.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) rotate(${r}deg) scale(${sx == null ? s : sx + ',' + s})`;
  e.style.opacity = o; if (f !== null) e.style.filter = f;
}
function capa(z = 10) { const c = h('div', 'capa'); c.style.zIndex = z; return c; }
// Visibilidad de una escena con fundidos
function vis(t, a, b, fi = .35, fo = .35) { return t < a - .001 || t > b + .001 ? 0 : Math.min(clamp((t - a) / fi), clamp((b - t) / fo)); }
const fmt = n => Math.round(n).toLocaleString('es-CO');

/* ── Íconos (SVG) ── */
const IC = {
  subir: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>`,
  ojo: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`,
  moneda: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.6-1-1.8-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.4 2.2-3 2.2-1.3 0-2.5-.6-3.1-1.6M12 6v2M12 16v2"/></svg>`,
  codigo: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>`,
  llave: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>`,
  movil: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>`,
  engranaje: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  escudo: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 9.3-8 11-4.5-1.7-8-6-8-11V5z"/><path d="M8 12l3 3 5-6"/></svg>`,
  camara: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>`,
  cadena: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>`,
  flecha: c => `<svg viewBox="0 0 24 24" fill="${c}"><path d="M12 2l9 10h-5v10H8V12H3z"/></svg>`,
};

/* ── Arte del juego (portada "NEON RIDER", original) ── */
const ARTE = `<svg viewBox="0 0 500 470" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9FFF2"/><stop offset="1" stop-color="#39FF88"/></linearGradient></defs>
  <circle cx="250" cy="250" r="120" fill="url(#sol)" opacity=".9"/>
  ${Array.from({ length: 7 }, (_, i) => `<rect x="120" y="${262 + i * 16}" width="260" height="${4 + i}" fill="#0B2A3A"/>`).join('')}
  <path d="M0 330 L90 240 L150 290 L230 200 L310 300 L380 230 L500 320 L500 470 L0 470Z" fill="#06101E" stroke="#39FF88" stroke-width="2" opacity=".95"/>
  <path d="M250 470 L235 330 L265 330 Z" fill="#39FF88" opacity=".5"/>
  ${Array.from({ length: 9 }, (_, i) => `<line x1="${250 - i * 70}" y1="470" x2="${250 - i * 4}" y2="330" stroke="#39FF88" stroke-opacity=".25"/><line x1="${250 + i * 70}" y1="470" x2="${250 + i * 4}" y2="330" stroke="#39FF88" stroke-opacity=".25"/>`).join('')}
  <g transform="translate(250 420)"><path d="M-70 0 L-58 -34 L58 -34 L70 0 Z" fill="#111A28" stroke="#F2F5F7" stroke-width="3"/><rect x="-60" y="-12" width="22" height="7" fill="#39FF88"/><rect x="38" y="-12" width="22" height="7" fill="#39FF88"/></g>
</svg>`;
function tarjetaJuego(padre) {
  const c = h('div', 'c juego bisel', `<div class="arte bisel-s">${ARTE}</div><div class="tit orb">NEON RIDER</div><div class="sub mono">TU JUEGO · INDIE</div><div class="est">★★★★★</div>`, padre);
  return c;
}
function telefono(padre, neon) {
  const t = h('div', 'c tel' + (neon ? ' neon' : ''), '<div class="pant"><div class="notch"></div></div>', padre);
  return { el: t, pant: t.querySelector('.pant') };
}
function cabeceraUI(pant) { return h('div', 'ui-hdr', '<div class="ui-logo"><b>UP</b>GAMES</div><div class="mono" style="font-size:24px;color:#8A94A6">● EN LÍNEA</div>', pant); }

/* ════════════════ FONDO (rejilla en perspectiva, estrellas) ════════════════ */
const bg = document.getElementById('bg'), bctx = bg.getContext('2d');
const estrellas = (() => { const r = rng(7); return Array.from({ length: 140 }, () => [r() * 1080, r() * 1100, r() * 1.8 + .4, r()]); })();
function fondo(t, tono) {
  // tono: 0 = gris (problema), 1 = verde (UpGames)
  const W = 1080, H = 1920;
  const g = bctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#03060C'); g.addColorStop(.55, '#06101F'); g.addColorStop(1, '#03060C');
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
  // resplandor
  const rg = bctx.createRadialGradient(W / 2, 1180, 50, W / 2, 1180, 900);
  rg.addColorStop(0, `rgba(${tono > .5 ? '57,255,136' : '138,148,166'},${.10 + .10 * tono})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
  bctx.fillStyle = rg; bctx.fillRect(0, 0, W, H);
  for (const [x, y, s, f] of estrellas) { bctx.globalAlpha = .25 + .5 * Math.abs(Math.sin(t * 1.3 + f * 9)); bctx.fillStyle = '#fff'; bctx.fillRect(x, y, s, s); }
  bctx.globalAlpha = 1;
  // rejilla del suelo
  const hz = 1230, col = tono > .5 ? `rgba(57,255,136,${.18 + .22 * tono})` : 'rgba(138,148,166,.22)';
  bctx.strokeStyle = col; bctx.lineWidth = 2;
  for (let i = -14; i <= 14; i++) { bctx.beginPath(); bctx.moveTo(W / 2 + i * 26, hz); bctx.lineTo(W / 2 + i * 260, H); bctx.stroke(); }
  const avance = (t * .55) % 1;
  for (let i = 0; i < 18; i++) { const k = (i + avance) / 18, y = hz + Math.pow(k, 2.3) * (H - hz); bctx.globalAlpha = k; bctx.beginPath(); bctx.moveTo(0, y); bctx.lineTo(W, y); bctx.stroke(); }
  bctx.globalAlpha = 1;
  const hl = bctx.createLinearGradient(0, hz - 60, 0, hz + 40); hl.addColorStop(0, 'rgba(3,6,12,0)'); hl.addColorStop(.6, tono > .5 ? 'rgba(57,255,136,.25)' : 'rgba(138,148,166,.15)'); hl.addColorStop(1, 'rgba(3,6,12,0)');
  bctx.fillStyle = hl; bctx.fillRect(0, hz - 60, W, 100);
}

/* ════════════════ ESCENA 1: el juego y las tiendas ════════════════ */
const e1 = capa(10);
const e1juego = tarjetaJuego(e1);
const e1chispas = Array.from({ length: 14 }, (_, i) => h('div', 'c verde', '✦', e1));
e1chispas.forEach(c => { c.style.fontSize = '46px'; });
const e1obst = [['$99 / AÑO', -250, -560, -8], ['30% COMISIÓN', 230, -470, 7], ['REGISTRO $25', -270, 470, 6], ['REGLA 4.2.1', 250, 560, -6], ['REVISIÓN: 14 DÍAS', -40, -760, 3], ['+ DOCUMENTOS', 40, 760, -4]]
  .map(([txt, x, y, r]) => ({ el: h('div', 'c etiqueta bisel-s', txt, e1), x, y, r }));
const e1sello = h('div', 'c sello', 'RECHAZADO', e1);
function esc1(t) {
  const a = vis(t, T.s1, T.s2, .01, .4); e1.style.opacity = a; if (!a) return;
  const lt = t - T.s1;
