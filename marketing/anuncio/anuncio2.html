<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=block" rel="stylesheet">
<style>
:root { --g: #39FF88; --w: #F2F5F7; --gr: #8A94A6; --gr2: #4A5361; --bg: #03060C; --rojo: #FF3B4E; }

html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: 'Rajdhani', sans-serif; color: var(--w); }

.capa { position: absolute; inset: 0; will-change: opacity, transform; transform-origin: 50% 50%; }
.c { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; }
.orb { font-family: 'Orbitron', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; }

.glow { text-shadow: 0 0 18px rgba(57,255,136,.75), 0 0 46px rgba(57,255,136,.35); }

.tel { width: 600px; height: 1240px; border-radius: 74px; background: #0B0F16; padding: 22px; box-shadow: 0 0 0 4px #2A313C, 0 40px 120px rgba(0,0,0,.85); }

.ui-hdr { position: absolute; left: 0; right: 0; top: 0; height: 150px; padding: 80px 30px 0; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid rgba(57,255,136,.4); background: rgba(3,6,12,.94); z-index: 20; }

<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="glitch"></div><div id="flash"></div><div id="barrido"></div><div id="scan"></div><div id="vigneta"></div>
</div>
<script>
'use strict';
/* ── Tiempos: cada escena empieza en su palabra de la locución (Whisper, audio editado) ── */
const T = {
  a1: 0,       // ¿Estás harto de tener el celular lleno de aplicaciones…?
  a2: 5.6,     // ¿O de lidiar con páginas llenas de virus, botones falsos…?
  a3: 12.7,    // Sabemos que tener una app para ver directos, otra para chatear…
  a4: 24.3,    // ¿Y si te dijera… todo tu mundo gamer en un solo lugar…?
  a5: 33.0,    // ¡Eso es UpGames! (el drop de la música cae en 33.61)
  a6: 39.7,    // Olvídate de los enlaces peligrosos…
  a7: 43.55,   // Aquí tienes un catálogo inmenso…
  a8: 50.7,    // Pero eso es solo el principio.
  chat: 52.95, // Chatea con tu comunidad
  live: 54.1,  // disfruta de lives…
  vids: 55.6,  // …y videos de tus creadores favoritos
  a9: 57.2,    // y deja que NEXUS, tu IA asistente personal…
  a10: 64.1,   // Únete a los miles de usuarios…
  a11: 67.8,   // ¿Qué esperas para subir de nivel? Cambia tu ecosistema.
  a12: 71.2,   // Entra a upgames.games… número uno en toda Latinoamérica…
  fin: 75.9,   // …y descubre tu nuevo hogar digital hoy mismo.
  total: 83.4,
};
const DROP = 33.61, BPM = 100;   // "Just Evil" (Infraction) con la intro alargada 6 compases
window.DURACION = T.total;

/* ── Utilidades ── */
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: k => k, out: k => 1 - Math.pow(1 - k, 3), out5: k => 1 - Math.pow(1 - k, 5), in: k => k * k * k,
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  back: k => { const c = 1.9, c3 = c + 1; return 1 + c3 * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
};
const P = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function h(tag, cls, html, padre) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (padre || stage).appendChild(e); return e; }
function pon(e, { x = 0, y = 0, s = 1, r = 0, o = 1, f = null, ry = 0, rx = 0 } = {}) {
  e.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) perspective(1600px) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) scale(${s})`;
  e.style.opacity = o; if (f !== null) e.style.filter = f;
}
function capa(z = 10) { const c = h('div', 'capa'); c.style.zIndex = z; return c; }
function vis(t, a, b, fi = .35, fo = .35) { return t < a - .001 || t > b + .001 ? 0 : Math.min(clamp((t - a) / fi), clamp((b - t) / fo)); }
const fmt = n => Math.round(n).toLocaleString('es-CO');
// Cámara: empuje lento + leve deriva en cada escena
function camara(el, lt, dur, { z0 = 1, z1 = 1.07, dx = 0, dy = 0 } = {}) { const k = clamp(lt / dur); el.style.transform = `translate(${dx * k}px,${dy * k}px) scale(${lerp(z0, z1, E.io(k))})`; }
// Pulso al ritmo de la música (después del drop)
const beat = t => { if (t < DROP) return 0; const ph = ((t - DROP) * BPM / 60) % 1; return Math.pow(1 - ph, 4); };
const tipo = (txt, t, a, b) => txt.slice(0, Math.floor(txt.length * P(t, a, b, E.lin)));

/* ── Íconos ── */
const IC = {
  mando: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M6 8h12a4 4 0 0 1 4 4v2a3 3 0 0 1-5.4 1.8L15 14H9l-1.6 1.8A3 3 0 0 1 2 14v-2a4 4 0 0 1 4-4z"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r=".8" fill="${c}"/><circle cx="18" cy="13" r=".8" fill="${c}"/></svg>`,
  chat: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/><path d="M8 11h.01M12 11h.01M16 11h.01" stroke-width="3" stroke-linecap="round"/></svg>`,
  live: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><circle cx="12" cy="12" r="2.5" fill="${c}"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg>`,
  play: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z" fill="${c}"/></svg>`,
  bajar: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>`,
  rayo: c => `<svg viewBox="0 0 24 24" fill="${c}"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>`,
  escudo: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 9.3-8 11-4.5-1.7-8-6-8-11V5z"/><path d="M8 12l3 3 5-6"/></svg>`,
  etiqueta: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5" fill="${c}"/></svg>`,
  ia: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>`,
  cadena: c => `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>`,
};

/* ── Portadas de juegos ficticios (generadas) ── */
const NOMBRES_J = ['VOID HUNTERS', 'NEON RIDER', 'PIXEL SIEGE', 'ABYSS GATE', 'MECHA RUSH', 'LOST SIGNAL', 'SHADOW BYTE', 'STAR FORGE', 'IRON PULSE', 'HEX ARENA', 'NIGHT CIRCUIT', 'FROST CORE', 'DUNE RAIDERS', 'ECHO TOWER', 'GLITCH KART', 'SKY BREAKER', 'TURBO MOD', 'FPS BOOST', 'RETRO LAUNCHER', 'TEXTURE PACK'];
function portadaSVG(seed, titulo) {
  const r = rng(seed * 97 + 13), tono = [145, 160, 175, 190, 205, 125, 0, 0][Math.floor(r() * 8)], sat = tono ? 35 + r() * 40 : 0;
  const c1 = `hsl(${tono},${sat}%,${10 + r() * 10}%)`, c2 = `hsl(${tono},${sat}%,${30 + r() * 25}%)`, ac = r() > .5 ? '#39FF88' : '#F2F5F7';
  const tipoA = Math.floor(r() * 4); let arte = '';
  if (tipoA === 0) arte = `<circle cx="115" cy="120" r="${50 + r() * 30}" fill="${ac}" opacity=".85"/><path d="M0 200 L60 140 L110 180 L170 110 L230 170 L230 310 L0 310Z" fill="${c1}"/>`;
  else if (tipoA === 1) arte = Array.from({ length: 7 }, (_, i) => `<line x1="${i * 40}" y1="0" x2="${i * 40 - 120}" y2="310" stroke="${ac}" stroke-opacity=".35" stroke-width="${2 + r() * 6}"/>`).join('') + `<polygon points="115,60 175,170 55,170" fill="none" stroke="${ac}" stroke-width="5"/>`;
  else if (tipoA === 2) arte = `<g fill="${ac}" opacity=".9"><rect x="95" y="70" width="40" height="40"/><rect x="85" y="112" width="60" height="60"/><rect x="70" y="120" width="14" height="40"/><rect x="146" y="120" width="14" height="40"/><rect x="92" y="174" width="18" height="40"/><rect x="120" y="174" width="18" height="40"/></g>`;
  else arte = Array.from({ length: 5 }, (_, i) => `<circle cx="115" cy="140" r="${20 + i * 22}" fill="none" stroke="${ac}" stroke-opacity="${.9 - i * .15}" stroke-width="3"/>`).join('');
  return `<svg viewBox="0 0 230 310" width="100%" height="100%"><defs><linearGradient id="pg${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs>
    <rect width="230" height="310" fill="url(#pg${seed})"/>${arte}<rect y="236" width="230" height="74" fill="rgba(3,6,12,.82)"/>
    <text x="14" y="270" font-family="Orbitron" font-weight="900" font-size="${titulo.length > 11 ? 17 : 21}" fill="#F2F5F7">${titulo}</text><text x="14" y="296" font-family="Share Tech Mono" font-size="15" fill="#39FF88">✓ VERIFICADO</text></svg>`;
}
function telefono(padre, neon) { const t = h('div', 'c tel' + (neon ? ' neon' : ''), '<div class="pant"><div class="notch"></div></div>', padre); return { el: t, pant: t.querySelector('.pant') }; }
function cabecera(pant, txt = '● EN LÍNEA') { return h('div', 'ui-hdr', `<div class="ui-logo"><b>UP</b>GAMES</div><div class="mono" style="font-size:22px;color:#8A94A6">${txt}</div>`, pant); }

/* ════════════════ FONDO: degradado, rejilla, partículas con profundidad, pulso del ritmo ════════════════ */
const bg = document.getElementById('bg'), bx = bg.getContext('2d');
const PART = (() => { const r = rng(3); return Array.from({ length: 90 }, () => ({ x: r() * 1080, y: r() * 1920, z: .2 + r() * .8, f: r() })); })();
function fondo(t) {
  const W = 1080, H = 1920;
  // fases de color: 0-24.3 problema (gris/rojizo) · 24.3-33.6 vacío · después verde UpGames
  const prob = t < T.a4 ? 1 : 0, vacio = t >= T.a4 && t < DROP ? 1 : 0, verde = t >= DROP ? 1 : 0;
  const g = bx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#03060C'); g.addColorStop(.55, vacio ? '#020408' : '#06101F'); g.addColorStop(1, '#03060C');
  bx.fillStyle = g; bx.fillRect(0, 0, W, H);
  const b = beat(t);
  const rg = bx.createRadialGradient(W / 2, 1150, 40, W / 2, 1150, 950);
  rg.addColorStop(0, prob ? 'rgba(255,59,78,.08)' : verde ? `rgba(57,255,136,${.16 + .12 * b})` : 'rgba(57,255,136,.04)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  bx.fillStyle = rg; bx.fillRect(0, 0, W, H);
  // partículas (bokeh) con paralaje
  for (const p of PART) {
    const y = (p.y - t * 40 * p.z + 1920 * 4) % 1920, x = p.x + Math.sin(t * .5 + p.f * 9) * 20 * p.z, rr = 1.5 + p.z * 4.5;
    bx.globalAlpha = (.12 + .45 * p.z) * (vacio ? .5 : 1); bx.fillStyle = prob ? (p.f > .8 ? '#FF3B4E' : '#8A94A6') : (p.f > .7 ? '#F2F5F7' : '#39FF88');
    bx.beginPath(); bx.arc(x, y, rr, 0, Math.PI * 2); bx.fill();
  }
  bx.globalAlpha = 1;
  if (vacio) return;
  const hz = 1260, col = prob ? 'rgba(138,148,166,.18)' : `rgba(57,255,136,${.28 + .25 * b})`;
  bx.strokeStyle = col; bx.lineWidth = 2;
  for (let i = -14; i <= 14; i++) { bx.beginPath(); bx.moveTo(W / 2 + i * 26, hz); bx.lineTo(W / 2 + i * 260, H); bx.stroke(); }
  const av = (t * (verde ? .9 : .4)) % 1;
  for (let i = 0; i < 18; i++) { const k = (i + av) / 18, y = hz + Math.pow(k, 2.3) * (H - hz); bx.globalAlpha = k; bx.beginPath(); bx.moveTo(0, y); bx.lineTo(W, y); bx.stroke(); }
  bx.globalAlpha = 1;
}

/* ════════ A1 · celular lleno de aplicaciones ════════ */
const a1 = capa(10);
const a1tel = telefono(a1, false);
h('div', 'barra-est', '<span>9:41</span><span>📶 🔋 12%</span>', a1tel.pant);
a1tel.pant.style.background = 'radial-gradient(circle at 30% 20%, #1C2A3E, #070B12 70%)';
const APPS = [['🎮', '#4A5361', 'Juegos'], ['📺', '#59616E', 'Lives'], ['💬', '#3A4250', 'Chat'], ['⬇', '#6B7380', 'Mods'], ['▶', '#4A5361', 'Videos'], ['🌐', '#59616E', 'Web'], ['🕹', '#3A4250', 'Emu'], ['📁', '#6B7380', 'Archivos'], ['🎧', '#4A5361', 'Voz'], ['🛒', '#59616E', 'Tienda'], ['📰', '#3A4250', 'Noticias'], ['🧩', '#6B7380', 'Mods 2'], ['📷', '#4A5361', 'Clips'], ['🔧', '#59616E', 'Ajustes'], ['💾', '#3A4250', 'Backup'], ['🎯', '#6B7380', 'Retos'], ['🗂', '#4A5361', 'Gestor'], ['📡', '#59616E', 'Stream'], ['🧪', '#3A4250', 'Beta'], ['🎲', '#6B7380', 'Más'], ['🔊', '#4A5361', 'Audio'], ['🗺', '#59616E', 'Mapas'], ['⚙', '#3A4250', 'Config'], ['🧷', '#6B7380', 'Extra']];
