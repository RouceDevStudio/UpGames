<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#333}</style>
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "three/addons/": "../lib/addons/" } }</script></head><body>
<script type="module">
// Prueba del piloto escaneado de pie andando: ?fase=0..6.28 &v=lado|frente|tres
import * as THREE from 'three';
import { cargarPilotoDePie, PilotoDePie } from '../js/render/pilotoGLB.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a3d44);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.4)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 3, 2); scene.add(d);
scene.add(new THREE.GridHelper(4, 40, 0x666666, 0x444444));
const p = new PilotoDePie(await cargarPilotoDePie(), { traje: '#0d47ff', casco: '#00e5ff' }); scene.add(p.raiz);
p.andar = 1.3; p.fase = +(q.get('fase') || 1.4); p.actualizar(0.0001);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 50);
const v = { lado: [[0, 1.0, 4.5], [0, 0.9, 0]], frente: [[4.5, 1.0, 0], [0, 0.9, 0]], tres: [[3, 1.6, 3], [0, 0.9, 0]] }[q.get('v') || 'lado'];
cam.position.set(...v[0]); cam.lookAt(...v[1]);
r.render(scene, cam); window.listo = true;
</script></body></html>
