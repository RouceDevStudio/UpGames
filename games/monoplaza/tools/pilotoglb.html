<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#333}</style>
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "three/addons/": "../lib/addons/" } }</script></head><body>
<script type="module">
import * as THREE from 'three';
import { cargarPilotoGLB, PilotoGLB } from '../js/render/pilotoGLB.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a3d44);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.4)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 3, 2); scene.add(d);
scene.add(new THREE.GridHelper(4, 40, 0x666666, 0x444444));
const dat = await cargarPilotoGLB(q.get('ligero') === '1');
const grupo = new THREE.Group(); scene.add(grupo);
const p = new PilotoGLB(dat, { traje: '#0d47ff', casco: '#00e5ff' }); grupo.add(p.raiz);
grupo.updateMatrixWorld(true);
// ?reg=1: colores por región (rojo brazo dcho., verde brazo izq., gris resto)
if (q.get('reg')) { const c = new Float32Array(dat.region.length * 3); dat.region.forEach((g, i) => c.set(g === 1 ? [1, 0, 0] : g === 2 ? [0, 1, 0] : [0.6, 0.6, 0.6], i * 3)); dat.geo.setAttribute('color', new THREE.BufferAttribute(c, 3)); p.malla.material = new THREE.MeshLambertMaterial({ vertexColors: true }); }
const cv = (q.get('cam') || '').split(',').map(Number);
if (q.get('reposo') !== '1') p.posar(grupo, [new THREE.Vector3(0.44, 0.66, -0.15), new THREE.Vector3(0.44, 0.66, 0.15)], new THREE.Euler());
// marcas: volante y hombros del piloto procedural
for (const z of [-0.15, 0.15]) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.02), new THREE.MeshBasicMaterial({ color: 0xff0000 })); m.position.set(0.44, 0.66, z); scene.add(m); }
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 50);
const v = { lado: [[0.2, 0.6, 2.6], [0.2, 0.55, 0]], frente: [[2.6, 0.7, 0], [0.1, 0.55, 0]], arriba: [[0.25, 2.8, 0.01], [0.25, 0.5, 0]], tres: [[1.6, 1.3, 1.6], [0.15, 0.55, 0]] }[q.get('v') || 'lado'];
if (cv.length === 6) { cam.position.set(cv[0], cv[1], cv[2]); cam.lookAt(cv[3], cv[4], cv[5]); } else { cam.position.set(...v[0]); cam.lookAt(...v[1]); }
r.render(scene, cam); window.listo = true;
</script></body></html>
