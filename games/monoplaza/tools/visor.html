<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Visor del modelo</title>
<style>html,body{margin:0;height:100%;background:#3a3a3a;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js", "three/addons/": "../lib/addons/" } }</script>
</head><body>
<script type="module">
// Visor del monoplaza para revisar el modelado: ?gris=1 (como en un editor 3D), ?vista=3q|lado|arriba|frente|cabina|cara
import * as THREE from 'three';
import { crearModelo } from '../js/render/cocheModelo.js';
import { EQUIPOS } from '../js/config.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight); r.setPixelRatio(1);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a3a3a);
const pm = new THREE.PMREMGenerator(r);
const env = new THREE.Scene(); env.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
scene.environment = pm.fromScene(env).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.2));
const sol = new THREE.DirectionalLight(0xffffff, 2.5); sol.position.set(4, 8, 5); sol.castShadow = true; scene.add(sol);
const suelo = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x404040 }));
suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; scene.add(suelo);
scene.add(new THREE.GridHelper(40, 40, 0x555555, 0x4a4a4a));
const ie = +(q.get('equipo') || 0);
const m = crearModelo({ equipo: EQUIPOS[ie], equipado: { patron: EQUIPOS[ie].patron, numero: 7, casco: 'rayas' }, calidad: +(q.get('calidad') ?? 3), cabina: q.get('vista') === 'cabina' });
if (q.get('gris')) m.raiz.traverse(o => { if (o.isMesh && !o.material.emissive?.getHex?.()) o.material = new THREE.MeshStandardMaterial({ color: 0xb8b8b8, roughness: 0.55 }); });
scene.add(m.raiz);
// ?caras=1: las caras vistas por detrás salen en rojo (normales o sentido de giro al revés)
if (q.get('caras')) { const lista = []; m.raiz.traverse(o => { if (o.isMesh && o.material && !o.material.transparent) lista.push(o); });
  for (const o of lista) { const r2 = new THREE.Mesh(o.geometry, new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.BackSide })); o.add(r2); } }
const coche = { ruedas: [0, 1, 2, 3].map(k => ({ angulo: k < 2 ? +(q.get('giro') || 0) : 0, giro: 0, izquierda: k % 2 === 0, neum: { tSup: 90, desgaste: +(q.get('desgaste') || 0), graining: +(q.get('graining') || 0), ampollas: +(q.get('ampollas') || 0), c: { tOpt: 90 } } })), dano: { pinchazo: [0, 0, 0, 0], suelta: [0, 0, 0, 0], susp: [0, 0, 0, 0], aleronTras: 0 }, cabeceo: 0, balanceo: 0, alturaDel: 0.032, alturaTras: 0.075, danoAleron: 0, drsAbierto: false, ersPotenciaActual: 0, anguloVolante: +(q.get('giro') || 0), ayF: 0, axF: 0, rpm: 11000, marcha: 5, velocidad: 50, mandos: { ersModo: 1 }, combustible: 50, ers: 3e6 };
// ?golpes=n: n golpes en el lateral izquierdo y en el morro, como si viniera de varios choques
const nG = +(q.get('golpes') || 0);
if (nG) {
  coche.dano.zona = { del: 0, tras: 0, izq: 0, der: 0 }; coche.dano.abolladuras = []; coche.dano.piezas = 0;
  const lista = [[0.9, 0.95, 16], [-0.4, 0.95, 18], [2.6, 0.3, 14], [1.6, 0.95, 20], [-1.6, -0.9, 15]];
  for (let k = 0; k < nG; k++) { const [x, z, vn] = lista[k % lista.length];
    coche.dano.abolladuras.push({ x, z, prof: Math.min(0.2, (vn - 5) * 0.013), r: Math.min(0.8, 0.3 + vn * 0.014), sem: k * 0.37 });
    if (Math.abs(z) > 0.3) coche.dano.zona[z > 0 ? 'izq' : 'der'] += (vn - 4) * 0.045; else coche.dano.zona.del += (vn - 4) * 0.04; }
  coche.danoAleron = Math.min(1, coche.dano.zona.del * 1.2);
}
if (q.get('desintegrado')) { coche.dano.desintegrado = true; coche.dano.suelta[2] = coche.dano.suelta[3] = true; coche.danoAleron = 0.8; }
m.actualizar(coche, 0.2);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.02, 200);
const vistas = {
  '3q': [[4.2, 2.6, 4.6], [0.2, 0.3, 0]], lado: [[0, 0.6, 7.5], [0.2, 0.4, 0]], arriba: [[0.2, 9, 0.01], [0.2, 0, 0]],
  frente: [[7, 1.1, 0], [0, 0.4, 0]], rueda: [[2.6, 0.55, 1.6], [1.7, 0.33, 0.8]], trasera: [[-6, 1.6, 2.5], [0, 0.5, 0]], blender: [[3.6, 4.2, -3.2], [0.2, 0.2, 0]],
  cabina: [[0.16, 0.9, 0], [30, -0.2, 0]], cara: [[0.60, 0.94, 0], [0.0, 0.83, 0]],
};
const [p, t] = vistas[q.get('vista') || '3q'];
if (q.get('vista') === 'cabina' || q.get('vista') === 'cara') { m.raiz.updateMatrixWorld(true); cam.position.set(...p).applyMatrix4(m.carroceria.matrixWorld); cam.lookAt(new THREE.Vector3(...t).applyMatrix4(m.carroceria.matrixWorld)); cam.fov = q.get('vista') === 'cabina' ? 75 : 55; cam.near = 0.02; }
else { cam.position.set(...p); cam.lookAt(...t); }
cam.updateProjectionMatrix();
r.render(scene, cam);
window.listo = true;
</script></body></html>
