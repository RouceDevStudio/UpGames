<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <title>APEX GP · UpGames</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a38"/><stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="rojo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/><stop offset="1" stop-color="#b30f1a"/>
    </linearGradient>
    <linearGradient id="blanco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d3e3"/>
    </linearGradient>
    <linearGradient id="vel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <pattern id="cuadros" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#ffffff"/><rect width="12" height="12" fill="#0d0f14"/><rect x="12" y="12" width="12" height="12" fill="#0d0f14"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" rx="48" fill="url(#fondo)"/>
  <!-- trazada del vértice (apex): curva que toca el piano -->
  <path d="M90 470 C 330 470, 470 170, 760 150 S 1100 210, 1130 250" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="56" stroke-linecap="round"/>
  <path d="M90 470 C 330 470, 470 170, 760 150 S 1100 210, 1130 250" fill="none" stroke="#e8202a" stroke-width="8" stroke-dasharray="26 18" stroke-linecap="round"/>
  <!-- líneas de velocidad -->
  <rect x="70" y="300" width="300" height="10" rx="5" fill="url(#vel)"/>
  <rect x="120" y="330" width="250" height="8" rx="4" fill="url(#vel)" opacity=".7"/>
  <rect x="170" y="356" width="200" height="6" rx="3" fill="url(#vel)" opacity=".5"/>
  <!-- monoplaza de perfil -->
  <g transform="translate(882 268) scale(-1 1)">
    <path d="M0 62 L60 58 L150 44 L200 18 L265 14 L300 30 L370 38 L470 48 L520 52 L522 66 Z" fill="url(#rojo)"/>
    <path d="M205 20 Q235 -6 270 14" fill="none" stroke="#e9eef6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="238" cy="10" r="13" fill="#ffffff"/><rect x="230" y="6" width="16" height="6" rx="2" fill="#0b0d14"/>
    <rect x="-8" y="56" width="70" height="9" rx="3" fill="#ffffff"/>
    <rect x="460" y="20" width="56" height="9" rx="3" fill="#ffffff"/><rect x="490" y="20" width="8" height="36" fill="#e9eef6"/>
    <circle cx="105" cy="72" r="30" fill="#0d0f14" stroke="#2a2d36" stroke-width="6"/><circle cx="105" cy="72" r="11" fill="#ffd23f"/>
    <circle cx="405" cy="72" r="33" fill="#0d0f14" stroke="#2a2d36" stroke-width="6"/><circle cx="405" cy="72" r="12" fill="#ffd23f"/>
  </g>
  <text x="600" y="322" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle">UPGAMES</text>
  <!-- nombre -->
  <text x="600" y="232" font-family="Arial Black, Arial, sans-serif" font-size="190" font-weight="900" font-style="italic" fill="url(#blanco)" text-anchor="middle" letter-spacing="6">APEX</text>
  <g transform="skewX(-12)">
    <rect x="770" y="402" width="300" height="118" rx="14" fill="url(#rojo)"/>
    <text x="920" y="497" font-family="Arial Black, Arial, sans-serif" font-size="104" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">GP</text>
  </g>
  <rect x="150" y="430" width="420" height="24" fill="url(#cuadros)" transform="skewX(-12)"/>
  <text x="290" y="510" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#00e5ff" letter-spacing="10" text-anchor="middle">by UPGAMES</text>
</svg>
