/* ═══════════════════════════════════════════════════════════════
   PERFIL PÚBLICO v7 — mismo lenguaje visual que el perfil personal
   (biblioteca.css · "PERFIL v6"): portada 3:1 que se desvanece en el
   fondo, avatar montado, estadísticas, redes sociales y cuadrícula.
═══════════════════════════════════════════════════════════════ */
:root {
  --g: #32D583; --g-rgb: 50,213,131; --g-dim: rgba(50,213,131,.12); --g-glow: rgba(50,213,131,.25);
  --cy: #5AC8FA; --cy-rgb: 90,200,250;
  --bg: #0A0B0F; --bg-rgb: 10,11,15; --bg1: #111318; --bg2: #171A21; --bg3: #1F232C;
  --bd: rgba(255,255,255,.08); --bd-g: rgba(50,213,131,.24);
  --txt: #F4F5F7; --txt2: #A3A8B6; --txt3: #6C7180;
  --danger: #ff4343; --bronce: #cd7f32; --oro: #c0c0c0; --elite: #FFFF50;
  --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.25,.64,1);
  --ff: 'Manrope', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --hdr-h: 56px;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); font-family: var(--ff); color: var(--txt); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
img { display: block; }
button { cursor: pointer; background: none; border: none; color: inherit; font-family: inherit; }
a { text-decoration: none; color: inherit; }

/* ── Barra superior: cristal, flota sobre la portada ── */
.top-bar {
  position: sticky; top: 0; z-index: 50; height: var(--hdr-h);
  display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: rgba(var(--bg-rgb), .72); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--bd);
}
.tb-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 1.2rem; color: var(--txt); background: rgba(255,255,255,.06); border: 1px solid var(--bd); transition: background .2s; flex-shrink: 0; }
.tb-btn:hover { background: rgba(255,255,255,.12); }
.tb-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.tb-title b { font-size: .95rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s var(--ease); }
.tb-title small { font-size: .68rem; color: var(--txt2); opacity: 0; transition: opacity .25s; }
.top-bar.scrolled .tb-title b, .top-bar.scrolled .tb-title small { opacity: 1; transform: none; }
.top-bar-logo { font-weight: 900; letter-spacing: .5px; font-size: 1rem; }
.top-bar-logo .up { color: var(--g); }
.top-bar.scrolled .top-bar-logo { display: none; }

/* ── Cabecera ── */
.profile-hero { max-width: 720px; margin: 0 auto; position: relative; }
.hero-cover {
  position: relative; width: 100%; aspect-ratio: 3 / 1; min-height: 130px; max-height: 260px;
  background:
    radial-gradient(120% 140% at 85% -20%, rgba(var(--g-rgb), .25), transparent 60%),
    radial-gradient(90% 120% at 0% 120%, rgba(var(--cy-rgb), .2), transparent 60%),
    linear-gradient(135deg, var(--bg2), var(--bg1));
  background-size: cover; background-position: center;
  /* Desvanecido: la portada se funde con el fondo, sin línea dura */
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 50%, rgba(0,0,0,.55) 75%, transparent 100%);
          mask-image: linear-gradient(180deg, #000 0%, #000 50%, rgba(0,0,0,.55) 75%, transparent 100%);
}
@media (min-width: 720px) { .hero-cover { border-radius: 0 0 22px 22px; } }
.hero-cover-edit {
  position: absolute; right: 12px; top: 12px; z-index: 2; display: none; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.2); background: rgba(var(--bg-rgb), .55);
  color: #fff; font: 700 .72rem/1 var(--ff); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.hero-cover-edit.show { display: inline-flex; }

.pp-head { display: flex; align-items: flex-end; gap: 14px; padding: 0 16px; margin-top: -52px; position: relative; z-index: 3; }
.hero-avatar-wrap { position: relative; flex-shrink: 0; border-radius: 50%; }
.avatar {
  width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--bg); overflow: hidden;
  background: linear-gradient(135deg, var(--g), var(--cy)); display: grid; place-items: center;
  color: #06210f; font-size: 2.2rem; font-weight: 900; box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.pp-stats { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: 8px; }
.stat-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; }
.stat-number { font-size: 1.18rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-label { font-size: .68rem; color: var(--txt2); }

.hero-info { padding: 12px 16px 4px; }
.hero-username { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 1.2rem; font-weight: 800; }
.hero-at { color: var(--txt2); font-weight: 700; margin-right: -4px; }
.verificado-badge { display: inline-flex; align-items: center; font-size: 1.05rem; }
.verificado-badge.level-1 { color: var(--bronce); }
.verificado-badge.level-2 { color: var(--oro); filter: drop-shadow(0 0 4px rgba(255,215,0,.4)); }
.verificado-badge.level-3 { color: var(--elite); filter: drop-shadow(0 0 8px var(--elite)); }
.hero-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: .74rem; color: var(--txt3); }
.hero-meta span { display: inline-flex; align-items: center; gap: 4px; }
.hero-meta ion-icon { font-size: .85rem; }
.hero-bio { margin-top: 8px; font-size: .88rem; line-height: 1.45; color: var(--txt2); white-space: pre-line; word-break: break-word; }

/* Redes sociales (las mismas que el creador pone en su perfil) */
.pp-social { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pp-social:empty { display: none; }
.pp-social a {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 1.1rem;
  background: var(--bg2); border: 1px solid var(--bd); transition: transform .2s var(--spring), background .2s, border-color .2s;
}
.pp-social a:hover { transform: translateY(-2px) scale(1.08); background: var(--bg3); border-color: currentColor; }

/* Acciones */
.hero-action-row { display: flex; gap: 8px; padding: 14px 16px 4px; }
.btn-seguir, .btn-mensaje, .btn-compartir {
  flex: 1; min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 12px; font: 800 .86rem/1 var(--ff); border: 1px solid var(--bd); background: var(--bg2); color: var(--txt);
  transition: background .2s, transform .15s var(--ease), box-shadow .2s;
}
.btn-seguir { background: var(--g); border-color: var(--g); color: #06210f; }
.btn-seguir:hover:not(:disabled) { box-shadow: 0 6px 22px var(--g-glow); }
.btn-seguir.btn-siguiendo { background: var(--bg2); border-color: var(--bd-g); color: var(--g); }
.btn-seguir:disabled { opacity: .5; cursor: default; }
.btn-mensaje:hover, .btn-compartir:hover { background: var(--bg3); }
.btn-seguir:active, .btn-mensaje:active, .btn-compartir:active { transform: scale(.97); }
.btn-compartir { flex: 0 0 44px; padding: 0; font-size: 1.1rem; }
.btn-seguir ion-icon, .btn-mensaje ion-icon { font-size: 1.05rem; }

/* ── Pestañas ── */
.container { max-width: 720px; margin: 0 auto; padding-bottom: 40px; }
.pub-subnav {
  display: flex; margin-top: 14px; position: sticky; top: var(--hdr-h); z-index: 20; overflow-x: auto; scrollbar-width: none;
  background: rgba(var(--bg-rgb), .9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--bd);
}
.pub-subnav::-webkit-scrollbar { display: none; }
.pub-subnav-tab {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  padding: 13px 12px; font-size: .78rem; font-weight: 700; color: var(--txt3); border-bottom: 2px solid transparent; transition: color .2s, border-color .2s;
}
.pub-subnav-tab ion-icon { font-size: 1rem; }
.pub-subnav-tab.active { color: var(--txt); border-bottom-color: var(--txt); }
.pub-subnav-count { font-size: .64rem; padding: 1px 6px; border-radius: 99px; background: var(--bg3); color: var(--txt2); }
.pub-panel { display: none; }
.pub-panel.active { display: block; animation: ppIn .3s var(--ease); }
@keyframes ppIn { from { opacity: 0; transform: translateY(6px); } }

/* ── Cuadrícula ── */
#user-items.items-grid, #user-videos.items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.pp-tile { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: var(--bg2); display: block; }
.pp-tile img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease, filter .2s; }
.pp-tile:hover img { transform: scale(1.04); filter: brightness(.88); }
.pp-tile::after { content: ''; position: absolute; inset: 55% 0 0; background: linear-gradient(transparent, rgba(0,0,0,.55)); pointer-events: none; }
.pp-tile-ph { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 8px 26px; background: linear-gradient(135deg, var(--bg2), var(--bg3)); }
.pp-tile.no-img .pp-tile-ph { display: flex; }
.pp-tile-ph ion-icon { font-size: 1.5rem; color: var(--g); }
.pp-tile-ph em { font-style: normal; font-size: .66rem; font-weight: 700; color: var(--txt2); text-align: center; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pp-tile-meta { position: absolute; left: 6px; bottom: 6px; z-index: 1; display: inline-flex; align-items: center; gap: 3px; font-size: .7rem; font-weight: 800; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
.pp-tile-serie { position: absolute; left: 6px; top: 6px; display: flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 999px; background: rgba(0,0,0,.6); color: #8fdcff; font-size: .68rem; font-weight: 800; backdrop-filter: blur(6px); }
.pp-tile-type { position: absolute; right: 6px; top: 6px; color: #fff; font-size: 1rem; filter: drop-shadow(0 1px 3px rgba(0,0,0,.7)); }
.pp-tile-badge { position: absolute; left: 6px; top: 6px; padding: 2px 7px; border-radius: 99px; font-size: .58rem; font-weight: 800; background: rgba(255,204,0,.92); color: #1a1400; }
.pp-tile-badge.bad { background: rgba(255,67,67,.92); color: #fff; }
@media (min-width: 640px) { #user-items.items-grid, #user-videos.items-grid { gap: 6px; padding: 6px 0; } .pp-tile { border-radius: 10px; } }

/* ── Vacíos, error y carga ── */
.empty-msg { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 56px 24px; text-align: center; }
.empty-msg ion-icon { font-size: 3rem; color: var(--txt3); opacity: .5; }
.empty-msg h3 { font-size: .95rem; font-weight: 700; color: var(--txt2); }
.empty-msg p { font-size: .82rem; color: var(--txt3); line-height: 1.5; }
.btn-volver-inicio { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 12px; background: var(--g); color: #06210f; font-weight: 800; font-size: .85rem; }
.pp-sk { background: linear-gradient(90deg, var(--bg2), var(--bg3), var(--bg2)); background-size: 200% 100%; animation: ppSk 1.2s infinite; border-radius: 8px; color: transparent !important; }
@keyframes ppSk { to { background-position: -200% 0; } }

/* ── En vivo ── */
.pp-live-banner { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; padding: 10px 14px; border-radius: 14px; background: linear-gradient(90deg, rgba(255,77,109,.22), rgba(255,122,89,.1)); border: 1px solid rgba(255,77,109,.45); color: #fff; font-size: .88rem; }
.pp-live-banner b { color: #ff4d6d; letter-spacing: .06em; font-size: .75rem; }
.pp-live-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d6d9e0; }
.pp-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4d6d; flex-shrink: 0; animation: ppLive 1.4s infinite; }
@keyframes ppLive { 50% { opacity: .3; } }

/* Aviso breve (sustituye a los alert()) */
.pp-toast { position: fixed; left: 50%; bottom: 24px; z-index: 100; transform: translate(-50%, 20px); opacity: 0; max-width: calc(100% - 32px);
  padding: 11px 16px; border-radius: 14px; background: rgba(23,26,33,.95); border: 1px solid var(--bd); color: var(--txt); font-size: .85rem; font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: opacity .25s, transform .25s var(--ease); pointer-events: none; }
.pp-toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .pp-tile img, .pub-panel.active, .pp-sk { transition: none; animation: none; } }

            { m: ['facebook.com', 'fb.com', 'fb.watch'], i: 'logo-facebook', c: '#1877F2', l: 'Facebook' },

            { m: ['t.me', 'telegram.me'], i: 'paper-plane', c: '#29A9EB', l: 'Telegram' },
        ];
        function ppPintarRedes(links) {
            const box = document.getElementById('pp-social'); if (!box) return;
            box.innerHTML = (Array.isArray(links) ? links : []).slice(0, 4).map(raw => {
                let url; try { url = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw); } catch (_) { return ''; }
                if (!/^https?:$/.test(url.protocol)) return '';
                const host = url.hostname.toLowerCase().replace(/^www\./, '');
                const r = PP_REDES.find(x => x.m.some(m => host === m || host.endsWith('.' + m))) || { i: 'link-outline', c: 'var(--txt2)', l: host };
                return `<a href="${ppEsc(url.href)}" target="_blank" rel="noopener nofollow ugc" style="color:${r.c}" title="${ppEsc(r.l)}" aria-label="${ppEsc(r.l)}"><ion-icon name="${r.i}"></ion-icon></a>`;
            }).join('');
        }
        function ppDesde(f) {
            const d = new Date(f); if (!f || isNaN(d)) return '';
            return d.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
        }

        // ── Helpers de presentación ──
        const ppEsc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const ppFmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n || 0);
        // Cloudinary: tamaño justo + formato automático (las fotos HEIC/4000px se ven y cargan rápido)
        function cldOpt(url, t) {
            const u = String(url || '');
            if (!/^https:\/\/res\.cloudinary\.com\/[^/]+\/image\/upload\//.test(u)) return u;
            if (/\/image\/upload\/(?!v\d+\/)[a-z]{1,3}_[^/]*\//.test(u)) return u.replace(/\.(heic|heif)(\?|$)/i, '.jpg$2');
            return u.replace('/image/upload/', `/image/upload/${t}/`).replace(/\.(heic|heif)(\?|$)/i, '.jpg$2');
        }
        // Diseño de tarjeta que compró el creador: se aplica a todas sus publicaciones
        function ppAplicarTarjetas() {
            const tj = window._ppTarjeta; if (!tj) return;
            document.querySelectorAll('#user-items .pp-tile, #user-videos .pp-tile').forEach(c => window.UGX?.vestirTarjeta?.(c, tj));
        }
        function ppTile(item) {
            const isVideo = item.category === 'Video';
            const img = item.image && !/\.(mp4|webm|mov|m4v|avi|3gp|3g2|mkv|ogv|mpe?g|wmv|flv)(\?|$)|\/video\/upload\//i.test(item.image) ? cldOpt(item.image, 'c_fill,g_auto,w_420,h_420,q_auto,f_auto') : '';
            const ls = item.linkStatus || 'online';
            const pending = item.status === 'pendiente' || item.status === 'pending';
            return `<a class="pp-tile${img ? '' : ' no-img'}" href="./biblioteca.html?id=${encodeURIComponent(item._id)}" aria-label="${ppEsc(item.title)}">
                ${img ? `<img src="${ppEsc(img)}" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add('no-img')">` : ''}
                <span class="pp-tile-ph"><ion-icon name="${isVideo ? 'play' : 'game-controller'}"></ion-icon><em>${ppEsc(item.serieInfo?.base || item.title)}</em></span>
                ${item.serieInfo ? `<span class="pp-tile-serie" title="${item.serieInfo.partes} partes"><ion-icon name="folder-open"></ion-icon>${item.serieInfo.partes}</span>` : ''}
                ${pending ? '<span class="pp-tile-badge">Pendiente</span>' : ls !== 'online' ? `<span class="pp-tile-badge ${ls === 'caido' ? 'bad' : ''}">${ls === 'caido' ? 'Link caído' : 'Revisión'}</span>` : ''}
                ${isVideo ? '<span class="pp-tile-type"><ion-icon name="play"></ion-icon></span>' : ''}
                <span class="pp-tile-meta"><ion-icon name="${isVideo ? 'eye-outline' : 'cloud-download-outline'}"></ion-icon>${ppFmt(isVideo ? (item.vistas || 0) + (item.descargasEfectivas || 0) : item.descargasEfectivas)}</span>
            </a>`;
        }
        async function compartirPerfil() {
            const url = location.href.split('#')[0];
            try { if (navigator.share) { await navigator.share({ title: `@${usuarioViendo} en UpGames`, url }); return; } }
            catch (e) { if (e && e.name === 'AbortError') return; }
            try { await navigator.clipboard.writeText(url); alert('🔗 Enlace del perfil copiado'); }
            catch (_) { prompt('Copia el enlace del perfil:', url); }
        }

        // Helper: fetch con manejo de errores
        async function fetchAPI(url, options = {}) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error("❌ Error en fetch:", error);
                throw error;
            }
        }

        // Helper: Badge de verificación
        function getVerificadoBadge(nivel) {
            if (!nivel || nivel === 0) return '';
            
            let levelClass = '';
            let icon = 'checkmark-circle';
            
            if (nivel === 1) levelClass = 'level-1';
            else if (nivel === 2) levelClass = 'level-2';
            else if (nivel === 3) {
                levelClass = 'level-3';
                icon = 'checkmark-done-circle-sharp';
            }
            
            return `<span class="verificado-badge ${levelClass}"><ion-icon name="${icon}"></ion-icon></span>`;
        }

        // ✅ CARGAR PUBLICACIONES — separadas en Juegos y Videos
        async function cargarPublicaciones() {
            try {
                const response = await fetchAPI(`${API_URL}/items/user/${uEnc}`);

                const esAutor = usuarioActual && usuarioActual.toLowerCase() === usuarioViendo.toLowerCase();
                const todos = Array.isArray(response)
                    ? (esAutor ? response : response.filter(item => item.status === 'aprobado'))
                    : [];

                // Lo más reciente primero (como Instagram/TikTok)
                todos.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                const juegos = todos.filter(i => i.category !== 'Video');
                const videos = todos.filter(i => i.category === 'Video');


                // Actualizar contadores del sub-nav
                document.getElementById('pub-subnav-count-pub').textContent = juegos.length;
                document.getElementById('pub-subnav-count-vid').textContent = videos.length;

                    contJuegos.innerHTML = `

                            <h3>Sin publicaciones</h3>
                            <p>Este usuario aún no ha publicado nada.</p>
                        </div>`;

                    contJuegos.innerHTML = juegos.map(ppTile).join('');

                    contVideos.innerHTML = videos.map(ppTile).join('');

                    <div class="empty-msg">
                        <ion-icon name="warning-outline"></ion-icon>
                        <h3>Error</h3>
                        <p>No se pudieron cargar las publicaciones</p>

        // ✅ CONFIGURAR BOTÓN DE SEGUIR
        function configurarBotonSeguir(estaSiguiendo) {
            const btnSeguir  = document.getElementById('btn-seguir');
            const btnMensaje = document.getElementById('btn-mensaje');
            
            if (!usuarioActual) {
                // Invitado: el perfil se ve completo; seguir pide cuenta y luego vuelve aquí

                btnSeguir.disabled = false;
                btnSeguir.className = 'btn-seguir';
                if (btnMensaje) btnMensaje.style.display = 'none';
                return;
            }

            btnSeguir.disabled = false;
            
            if (estaSiguiendo) {
                btnSeguir.innerHTML = `<ion-icon name="checkmark-circle-outline"></ion-icon> Siguiendo`;
                btnSeguir.className = 'btn-seguir btn-siguiendo';

                btnSeguir.className = 'btn-seguir';
                btnSeguir.onclick = seguirUsuario;
                // Ocultar botón de mensaje
                if (btnMensaje) btnMensaje.style.display = 'none';
            }
        }

        // ✅ SEGUIR USUARIO
        async function seguirUsuario() {
            if (!usuarioActual) {
                window.location.href = `../index.html?volver=${encodeURIComponent('./public/perfil-publico.html' + location.search.replace(/[^\w=&%.~+?-]/g, ''))}`;
                return;
            }

            const btnSeguir = document.getElementById('btn-seguir');
            const originalContent = btnSeguir.innerHTML;
            btnSeguir.disabled = true;
            btnSeguir.innerHTML = `<ion-icon name="hourglass-outline"></ion-icon> Procesando...`;

            try {
                const _tkn = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/usuarios/toggle-seguir/${encodeURIComponent(usuarioActual)}/${uEnc}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${_tkn}` }
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.siguiendo) {
                        try { const g = JSON.parse(localStorage.getItem('ug_guia') || '{}'); if (!g.seguir) { g.seguir = Date.now(); localStorage.setItem('ug_guia', JSON.stringify(g)); } } catch (_) {}   // guía de inicio
                        ppToast(`✅ Ahora sigues a @${usuarioViendo}`);
                    }
                    ppActualizarSeguidores(data.siguiendo ? 1 : -1);
                    configurarBotonSeguir(!!data.siguiendo);
                } else if (response.status === 401) {
                    // Sesión expirada — limpiar y redirigir con aviso claro
                    localStorage.clear();
                    alert('Tu sesión expiró. Por favor vuelve a iniciar sesión.');
                    window.location.replace('../index.html');
                } else {
                    throw new Error(data.error || "Error al seguir");
                }
            } catch (error) {
                console.error("❌ Error:", error);
                ppToast('❌ ' + (error.message || "Error de conexión"));
                btnSeguir.disabled = false;
                btnSeguir.innerHTML = originalContent;
            }
        }

                    window.location.replace('../index.html');
                } else {
                    throw new Error(data.error || "Error al dejar de seguir");
                }
            } catch (error) {
                console.error("❌ Error:", error);
                ppToast('❌ ' + (error.message || "Error de conexión"));
                btnSeguir.disabled = false;
                btnSeguir.innerHTML = originalContent;
            }
        }

        function ppActualizarSeguidores(delta) {
            ppSeguidores = Math.max(0, ppSeguidores + delta);
            document.getElementById('stat-followers').textContent = ppFmt(ppSeguidores);
        }

        // ✅ MOSTRAR ERROR
        function mostrarError(titulo, mensaje) {
            titulo = ppEsc(titulo); mensaje = ppEsc(mensaje);
            const n = document.getElementById('user-name-display'); if (n) { n.classList.remove('pp-sk'); n.textContent = usuarioViendo || '—'; }
            document.querySelector('.container').innerHTML = `
                <div style="padding:0 12px">
                    <div class="empty-msg">
                        <ion-icon name="alert-circle-outline" style="color:var(--danger);opacity:1;"></ion-icon>
                        <h3>${titulo}</h3>
                        <p>${mensaje}</p>
                        <button class="btn-volver-inicio" onclick="location.href='./biblioteca.html'">
                            <ion-icon name="arrow-back-outline"></ion-icon>
                            Volver al inicio
                        </button>
                    </div>
                </div>
            `;
        }

        // ✅ INICIALIZAR
        document.addEventListener('DOMContentLoaded', () => {
            // Volver: a la página anterior si vino de UpGames; si llegó por un enlace externo, a la biblioteca
            document.getElementById('btn-volver')?.addEventListener('click', e => {
                try { if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) { e.preventDefault(); history.back(); } } catch (_) {}
            });
            // La barra superior muestra el nombre cuando la cabecera sale de la vista
            const bar = document.getElementById('top-bar');
            const onScroll = () => bar.classList.toggle('scrolled', window.scrollY > 170);
            window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
            cargarPerfilUsuario();
        });
    </script>
