    <style>
/* ═══════════════════════════════════════════
   TOKENS — idénticos a biblioteca.html
═══════════════════════════════════════════ */
:root {
  --g:       #32D583;
  --g-dim:   rgba(50,213,131,.12);
  --g-glow:  rgba(50,213,131,.25);
  --cy:      #5AC8FA;
  --cy-dim:  rgba(90,200,250,.1);
  --bg:      #0A0B0F;
  --bg1:     #0d0d1a;
  --bg2:     #12121f;
  --bg3:     #191927;
  --bd:      rgba(255,255,255,.07);
  --bd-g:    rgba(50,213,131,.2);
  --txt:     #f0f0f8;
  --txt2:    #9090aa;
  --txt3:    #555570;
  --danger:  #ff4343;
  --warning: #ffcc00;
  --bronce:  #cd7f32;
  --oro:     #c0c0c0;
  --elite:   #FFFF50;
  --card-r:  18px;
  --ease:    cubic-bezier(.4,0,.2,1);
  --spring:  cubic-bezier(.34,1.4,.64,1);
  --ff:      'Manrope', -apple-system, sans-serif;
  --ff-mono: 'DM Mono', monospace;
  --ff-disp: 'Bebas Neue', sans-serif;
  --hdr-h:   56px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  font-family: var(--ff);
  color: var(--txt);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
img { display:block; }
button { cursor:pointer; background:none; border:none; color:inherit; font-family:inherit; }
a { text-decoration:none; color:inherit; }
::-webkit-scrollbar { display:none; }

/* ═══════════════════════════════════════════
   TOP BAR — sticky, mismo estilo que biblioteca
═══════════════════════════════════════════ */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 300;
  height: var(--hdr-h);
  background: rgba(7,7,15,.9);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--bd);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  gap: 12px;
}
.top-bar-logo {
  font-family: var(--ff-disp);
  font-size: 1.5rem;
  letter-spacing: 3px;
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}
.top-bar-logo .up { color: var(--g); }
.top-bar-logo .gm { color: var(--txt); }

.btn-volver {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border-radius: 10px;
  background: var(--bg2);
  border: 1.5px solid var(--bd);
  color: var(--txt2);
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .3px;
  transition: border-color .2s, color .2s;
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--ff);
}
.btn-volver ion-icon { font-size: .95rem; }
.btn-volver:hover { border-color: var(--bd-g); color: var(--g); }

/* ═══════════════════════════════════════════
   HERO — portada inmersiva + avatar flotante
═══════════════════════════════════════════ */
.profile-hero { position: relative; }

.hero-cover {
  height: 148px;
  position: relative;
  overflow: hidden;
  background: var(--bg1);
}
.hero-cover-gradient {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 120% 100% at 80% -20%, rgba(50,213,131,.18) 0%, transparent 60%),
    radial-gradient(ellipse 80% 80% at 10% 110%, rgba(90,200,250,.12) 0%, transparent 55%),
    linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 100%);
}
.hero-cover-scan {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px, transparent 3px,
    rgba(255,255,255,.013) 3px, rgba(255,255,255,.013) 4px
  );
  pointer-events: none;
}
.hero-cover-glow {
  position: absolute;
  top: -80px; right: -60px;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(50,213,131,.13), transparent 70%);
  pointer-events: none;
  animation: coverGlow 4s ease-in-out infinite;
}
@keyframes coverGlow {
  0%,100% { opacity:.7; transform:scale(1); }
  50%      { opacity:1; transform:scale(1.08); }
}
.hero-cover-line {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1.5px;
  background: linear-gradient(90deg,
    transparent 0%, var(--g) 20%, var(--cy) 50%, var(--g) 80%, transparent 100%);
  opacity: .35;
}

/* Avatar flotante — fuera de .hero-cover (que recorta con overflow:hidden),
   montado sobre el borde inferior de la portada */
.hero-avatar-wrap {
  position: absolute;
  left: 20px;
  top: 98px;              /* alto de portada (148) − 50 */
  z-index: 100;
}
/* Portada personalizada del usuario */
.hero-cover.has-banner { background-size: cover; background-position: center; }
.hero-cover.has-banner .hero-cover-gradient { background: linear-gradient(180deg, rgba(0,0,0,.05) 35%, rgba(10,11,15,.65) 100%); }
.hero-cover.has-banner .hero-cover-scan,
.hero-cover.has-banner .hero-cover-glow { display: none; }
.hero-cover-edit {
  position: absolute; right: 12px; bottom: 12px; z-index: 5;
  display: none; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 99px;
  border: 1px solid rgba(255,255,255,.2); background: rgba(10,11,15,.6);
  color: #fff; font: 600 12px/1 var(--ff-body, system-ui), sans-serif; text-decoration: none;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.hero-cover-edit.show { display: inline-flex; }
.avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--g), var(--cy));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--ff-disp);
  font-size: 2.8rem;
  letter-spacing: 2px;
  color: #000;
  border: 3.5px solid var(--bg);
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 0 0 1.5px var(--bd-g), 0 10px 40px rgba(0,0,0,.7), 0 0 30px rgba(50,213,131,.1);
  position: relative;
}
.avatar img { width:100%;
height:100%; object-fit:cover;
display:block;
    
}


/* Info tras la portada */
.hero-info {
  padding: 62px 16px 18px;
  background: var(--bg1);
  border-bottom: 1px solid var(--bd);
}
.hero-top-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}
.hero-name-col { flex: 1; min-width: 0; }
.hero-username {
  font-family: var(--ff-disp);
  font-size: 2rem;
  letter-spacing: 2.5px;
  color: var(--txt);
  line-height: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.hero-at { color: var(--g); }

.verificado-badge { display:inline-flex; align-items:center; font-size:1.05rem; }
.verificado-badge.level-1 { color: var(--bronce); }
.verificado-badge.level-2 { color: var(--oro); filter: drop-shadow(0 0 4px rgba(255,215,0,.4)); }
.verificado-badge.level-3 { color: var(--elite); filter: drop-shadow(0 0 8px var(--elite)); }

.hero-bio {
  font-size: .75rem;
  color: var(--txt3);
  font-family: var(--ff-mono);
  line-height: 1.5;
  margin-top: 6px;
  margin-bottom: 16px;
  max-width: 420px;
}

/* ═══════════════════════════════════════════
   STATS — 3 columnas (idéntico a biblioteca)
═══════════════════════════════════════════ */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.stat-item {
  background: var(--bg2);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 10px 8px;
  text-align: center;
  transition: border-color .2s, background .2s;
}
.stat-item:hover { border-color: var(--bd-g); background: var(--bg3); }
.stat-number {
  font-family: var(--ff-disp);
  font-size: 1.5rem;
  letter-spacing: 1.5px;
  color: var(--txt);
  line-height: 1;
  display: block;
}
.stat-label {
  font-size: .56rem;
  color: var(--txt3);
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  display: block;
  margin-top: 3px;
}

/* ═══════════════════════════════════════════
   BOTÓN SEGUIR
═══════════════════════════════════════════ */
.btn-seguir {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 40px;
  padding: 0 18px;
  border-radius: 12px;
  background: var(--g);
  color: #000;
  font-size: .8rem;
  font-weight: 800;
  letter-spacing: .4px;
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity .18s var(--ease), transform .18s var(--spring), box-shadow .18s;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
  font-family: var(--ff);
}
.btn-seguir::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.18), transparent);
  pointer-events: none;
}
.btn-seguir:hover:not(:disabled) { box-shadow: 0 4px 20px var(--g-glow); transform: translateY(-1px); }
.btn-seguir:active:not(:disabled) { opacity:.82; transform:scale(.97); }
.btn-seguir:disabled { opacity:.38; cursor:not-allowed; transform:none; box-shadow:none; }
.btn-seguir ion-icon { font-size: 1rem; }
.btn-seguir.btn-siguiendo {
  background: transparent;
  color: var(--g);
  border: 1.5px solid var(--bd-g);
  box-shadow: none;
}
.btn-seguir.btn-siguiendo::before { display: none; }
.btn-seguir.btn-siguiendo:hover:not(:disabled) { background: var(--g-dim); transform: none; box-shadow: none; }

/* Fila de acciones (Seguir + Mensaje) */
.hero-action-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* Botón Mensaje */
.btn-mensaje {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 40px;
  padding: 0 16px;
  border-radius: 12px;
  background: transparent;
  color: var(--cy);
  font-size: .8rem;
  font-weight: 800;
  letter-spacing: .4px;
  border: 1.5px solid rgba(90,200,250,.35);
  cursor: pointer;
  flex-shrink: 0;
  transition: background .18s, border-color .18s, transform .12s var(--spring);
  white-space: nowrap;
  font-family: var(--ff);
  animation: msgBtnIn .3s var(--spring);
}
@keyframes msgBtnIn {
  from { opacity:0; transform:scale(.85) translateX(8px); }
  to   { opacity:1; transform:scale(1)   translateX(0);   }
}
.btn-mensaje:hover  { background: rgba(90,200,250,.08); border-color: var(--cy); }
.btn-mensaje:active { transform: scale(.95); }
.btn-mensaje ion-icon { font-size: 1rem; }

/* ═══════════════════════════════════════════
   SECTION HEADER
═══════════════════════════════════════════ */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 16px 12px;
}
.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .7rem;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--txt2);
}
.section-title ion-icon { color: var(--g); font-size: .9rem; }
.section-count { font-family: var(--ff-mono); font-size: .68rem; color: var(--txt3); }

/* ═══════════════════════════════════════════
   GRID DE PUBLICACIONES
═══════════════════════════════════════════ */
.container { padding-bottom: 40px; }

.items-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 12px;
}

/* Card — gemelo visual de game-tile de biblioteca */
.item-card {
  background: var(--bg1);
  border-radius: var(--card-r);
  border: 1px solid var(--bd);
  overflow: hidden;
  cursor: pointer;
  transition: transform .18s var(--spring), border-color .18s, box-shadow .18s;
  position: relative;
  will-change: transform;
  animation: cardIn .35s var(--ease) both;
}
@keyframes cardIn {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}
.item-card:hover {
  transform: translateY(-3px);
  border-color: var(--bd-g);
  box-shadow: 0 8px 28px rgba(50,213,131,.1);
}
.item-card:active { transform:scale(.96); border-color:var(--bd-g); }

/* Thumbnail 16:9 */
.item-card .thumb-wrap {
  position: relative;
  aspect-ratio: 16/9;
  overflow: hidden;
  background: var(--bg2);
}
.item-card .thumb-wrap img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  transition: transform .3s var(--ease);
}
.item-card:hover .thumb-wrap img { transform: scale(1.04); }

/* Badge de estado */
.item-link-badge {
  position: absolute;
  top: 6px; right: 6px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: .58rem;
  font-weight: 800;
  letter-spacing: .5px;
  text-transform: uppercase;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  gap: 3px;
  border: 1px solid transparent;
}
.item-link-badge.online   { background:rgba(50,213,131,.15); color:var(--g);  border-color:rgba(50,213,131,.3); }
.item-link-badge.revision { background:rgba(255,204,0,.15); color:#ffcc00;   border-color:rgba(255,204,0,.3); }
.item-link-badge.caido    { background:rgba(255,67,67,.15);  color:#ff4343;  border-color:rgba(255,67,67,.3); }
.item-link-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
  animation: dotBlink 1.8s ease-in-out infinite;
}
@keyframes dotBlink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Info del card */
.item-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.item-category {
  font-size: .6rem;
  font-weight: 700;
  color: var(--cy);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.item-title {
  font-size: .82rem;
  font-weight: 700;
  color: var(--txt);
  line-height: 1.25;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.item-stats {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  padding: 6px 8px;
  background: var(--bg3);
  border-radius: 8px;
}
.item-stat {
  display: flex;
  align-items: center;
  gap: 3px;
  font-family: var(--ff-mono);
  font-size: .62rem;
  color: var(--txt3);
  flex: 1;
}
.item-stat ion-icon { font-size: .78rem; color: var(--g); flex-shrink: 0; }
.item-stat-val { color: var(--txt2); font-weight: 500; }

/* ═══════════════════════════════════════════
   EMPTY & ERROR
═══════════════════════════════════════════ */
.empty-msg {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 12px;
  text-align: center;
}
.empty-msg ion-icon { font-size: 3rem; color: var(--txt3); opacity: .45; }
.empty-msg h3 { font-size: .95rem; font-weight: 700; color: var(--txt2); }
.empty-msg p  { font-size: .82rem; color: var(--txt3); line-height: 1.5; }
.btn-volver-inicio {
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  background: var(--g);
  color: #000;
  border-radius: 12px;
  font-size: .82rem;
  font-weight: 800;
  border: none;
  cursor: pointer;
  transition: opacity .18s;
  font-family: var(--ff);
}
.btn-volver-inicio:active { opacity: .8; }

/* ═══════════════════════════════════════════
   SHIMMER para estados de carga
═══════════════════════════════════════════ */
@keyframes shimmer { from{transform:translateX(-100%)} to{transform:translateX(100%)} }

/* ═══════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media (min-width: 480px) {
  .items-grid { grid-template-columns: repeat(3, 1fr); }
  .hero-username { font-size: 2.3rem; }
}
@media (min-width: 700px) {
  .items-grid { grid-template-columns: repeat(4, 1fr); }
  .hero-cover  { height: 190px; }
  .hero-avatar-wrap { left: 28px; top: 136px; }
  .avatar { width: 108px; height: 108px; }
  .hero-info { padding-top: 70px; }
}
@media (min-width: 1000px) {
  .items-grid { grid-template-columns: repeat(5, 1fr); }
  .hero-cover  { height: 220px; }
  .hero-avatar-wrap { top: 166px; }
}

/* SUB-NAV Publicaciones / Videos */
.pub-subnav {
  position: sticky; top: var(--hdr-h); z-index: 200;
  display: flex; background: var(--bg);
  border-bottom: 1px solid var(--bd);
  padding: 0 4px; gap: 0;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.pub-subnav-tab {
  flex: 1; background: transparent; border: none;
  border-bottom: 2px solid transparent; color: var(--txt2);
  font-family: var(--ff); font-size: .72rem; font-weight: 700;
  padding: 10px 4px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  letter-spacing: .3px; text-transform: uppercase;
  transition: color .15s, border-color .15s;
}
.pub-subnav-tab.active       { color: var(--g);  border-bottom-color: var(--g); }
.pub-subnav-tab.tab-video.active { color: var(--cy); border-bottom-color: var(--cy); }
.pub-subnav-tab ion-icon { font-size: .9rem; }
.pub-subnav-count {
  font-size: .6rem; font-weight: 800; padding: 1px 6px;
  border-radius: 999px; border: 1px solid;
}
.pub-subnav-tab.active .pub-subnav-count {
  background: rgba(50,213,131,.15); color: var(--g); border-color: rgba(50,213,131,.25);
}
.pub-subnav-tab.tab-video.active .pub-subnav-count {
  background: rgba(90,200,250,.15); color: var(--cy); border-color: rgba(90,200,250,.25);
}
.pub-subnav-tab:not(.active) .pub-subnav-count {
  background: rgba(255,255,255,.05); color: var(--txt3); border-color: rgba(255,255,255,.08);
}
.pub-panel { display: none; }
.pub-panel.active { display: block; }

/* Card de video — full-width, YouTube-style */
.item-card--video {
  grid-column: 1 / -1; flex-direction: column;
  border-color: rgba(90,200,250,.15); background: var(--bg1);
}
.item-card--video .thumb-wrap {
  width: 100%; aspect-ratio: 16/9;
  border-radius: var(--card-r) var(--card-r) 0 0;
  overflow: hidden; position: relative;
}
.item-card--video:hover { border-color: rgba(90,200,250,.45); box-shadow: 0 8px 28px rgba(90,200,250,.08); }
.video-play-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.28); pointer-events: none;
}
.video-play-overlay ion-icon { font-size: 2.4rem; color: rgba(255,255,255,.9); filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
.video-type-badge {
  position: absolute; bottom: 6px; left: 6px;

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script>
        const API_URL = window.UG_CONFIG?.API_URL ?? "https://upgames-production.up.railway.app";
        const usuarioActual = localStorage.getItem("user_admin");
        const params = new URLSearchParams(window.location.search);
        const usuarioViendo = params.get("usuario") || params.get("u");   // ?u= lo usan push, notificaciones, admin y lives

        console.log("👤 Usuario actual:", usuarioActual);
        console.log("👁️ Viendo perfil de:", usuarioViendo);

        // ── Helpers de presentación ──
        const ppEsc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const ppFmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n || 0);
        // Cloudinary: tamaño justo + formato automático (las fotos HEIC/4000px se ven y cargan rápido)
        function cldOpt(url, t) {
            const u = String(url || '');
            if (!/^https:\/\/res\.cloudinary\.com\/[^/]+\/image\/upload\//.test(u)) return u;
            if (/\/image\/upload\/(?!v\d+\/)[a-z]{1,3}_[^/]*\//.test(u)) return u.replace(/\.(heic|heif)(\?|$)/i, '.jpg$2');
            return u.replace('/image/upload/', `/image/upload/${t}/`).replace(/\.(heic|heif)(\?|$)/i, '.jpg$2');
        }
        function ppTile(item) {
            const isVideo = item.category === 'Video';
            const img = item.image && !/\.(mp4|webm|mov|m4v|avi)(\?.*)?$/i.test(item.image) ? cldOpt(item.image, 'c_fill,g_auto,w_420,h_420,q_auto,f_auto') : '';
            const ls = item.linkStatus || 'online';
            const pending = item.status === 'pendiente' || item.status === 'pending';
            return `<a class="pp-tile${img ? '' : ' no-img'}" href="./biblioteca.html?id=${encodeURIComponent(item._id)}" aria-label="${ppEsc(item.title)}">
                ${img ? `<img src="${ppEsc(img)}" alt="" loading="lazy" onerror="this.remove();this.parentElement.classList.add('no-img')">` : ''}
                <span class="pp-tile-ph"><ion-icon name="${isVideo ? 'play' : 'game-controller'}"></ion-icon><em>${ppEsc(item.serieInfo?.base || item.title)}</em></span>
                ${item.serieInfo ? `<span class="pp-tile-serie" title="${item.serieInfo.partes} partes"><ion-icon name="folder-open"></ion-icon>${item.serieInfo.partes}</span>` : ''}
                ${pending ? '<span class="pp-tile-badge">Pendiente</span>' : ls !== 'online' ? `<span class="pp-tile-badge ${ls === 'caido' ? 'bad' : ''}">${ls === 'caido' ? 'Link caído' : 'Revisión'}</span>` : ''}
                ${isVideo ? '<span class="pp-tile-type"><ion-icon name="play"></ion-icon></span>' : ''}
                <span class="pp-tile-meta"><ion-icon name="${isVideo ? 'eye-outline' : 'cloud-download-outline'}"></ion-icon>${ppFmt(item.descargasEfectivas)}</span>
            </a>`;
        }
        async function compartirPerfil() {
            const url = location.href.split('#')[0];
            try { if (navigator.share) { await navigator.share({ title: `@${usuarioViendo} en UpGames`, url }); return; } }
            catch (e) { if (e && e.name === 'AbortError') return; }
            try { await navigator.clipboard.writeText(url); alert('🔗 Enlace del perfil copiado'); }
            catch (_) { prompt('Copia el enlace del perfil:', url); }
        }

        // Helper: fetch con manejo de errores
        async function fetchAPI(url, options = {}) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error("❌ Error en fetch:", error);
                throw error;
            }
        }

        // Helper: Badge de verificación
        function getVerificadoBadge(nivel) {
            if (!nivel || nivel === 0) return '';
            
            let levelClass = '';
            let icon = 'checkmark-circle';
            
            if (nivel === 1) levelClass = 'level-1';
            else if (nivel === 2) levelClass = 'level-2';
            else if (nivel === 3) {
                levelClass = 'level-3';
                icon = 'checkmark-done-circle-sharp';
            }
            
            return `<span class="verificado-badge ${levelClass}"><ion-icon name="${icon}"></ion-icon></span>`;
        }

        // ✅ CARGAR PERFIL
        async function cargarPerfilUsuario() {
            if (!usuarioViendo) {
                mostrarError('Usuario no encontrado', 'No se especificó un usuario válido.');
                return;
            }

            try {
                console.log("📡 Cargando perfil de:", usuarioViendo);
                
                const response = await fetchAPI(`${API_URL}/usuarios/perfil-publico/${usuarioViendo}`);
                
                if (!response.success || !response.usuario) {
                    throw new Error("Usuario no encontrado");
                }

                const user = response.usuario;
                console.log("✅ Perfil cargado:", user);

                // Actualizar UI
                document.getElementById('user-name-display').textContent = user.usuario;
                
                // Badge de verificación
                if (user.verificadoNivel > 0) {
                    document.getElementById('verificado-badge').innerHTML = getVerificadoBadge(user.verificadoNivel);
                }

                // Avatar
                const avatarImg = document.getElementById('avatar-img');
                const avatarIcon = document.getElementById('avatar-icon');
                
                if (user.avatar && user.avatar.trim() !== '') {
                    avatarImg.src = cldOpt(user.avatar, 'c_fill,g_face,w_400,h_400,q_auto,f_auto');
                    avatarImg.style.display = 'block';
                    avatarIcon.style.display = 'none';
                } else {
                    avatarIcon.textContent = user.usuario.charAt(0).toUpperCase();
                    avatarIcon.style.display = 'block';
                    avatarImg.style.display = 'none';
                }

                // Portada (imagen detrás del avatar)
                const cover = document.getElementById('hero-cover');
                if (user.banner && /^https:\/\/[^\s"'<>`\\]+$/i.test(user.banner)) {
                    cover.style.backgroundImage = `url("${cldOpt(user.banner, 'c_fill,g_auto,w_1500,h_500,q_auto,f_auto')}")`;
                    cover.classList.add('has-banner');
                }
                const esMiPerfil = usuarioActual && usuarioActual.toLowerCase() === String(user.usuario).toLowerCase();
                document.getElementById('hero-cover-edit').classList.toggle('show', !!esMiPerfil);

                // Estilo comprado con UpCoins: marco del avatar, color del nombre, fondo (si no tiene portada) e insignias
                const pintarEstilo = () => {
                    if (!window.UGX) return;
                    let ins = document.getElementById('pp-insignias');
                    if (!ins) { ins = document.createElement('div'); ins.id = 'pp-insignias'; ins.style.marginTop = '6px'; document.querySelector('.hero-username')?.after(ins); }
                    window.UGX.aplicarEstilo(user.estilo || {}, { avatar: document.querySelector('.hero-avatar-wrap'), nombre: document.getElementById('user-name-display'),
                        fondo: cover.classList.contains('has-banner') ? null : cover, insignias: ins });
                    if (user.premium && !document.getElementById('pp-premium')) document.getElementById('verificado-badge')?.insertAdjacentHTML('afterend', '<span id="pp-premium" title="Premium" style="margin-left:4px;color:#ffcc4d">⭐</span>');
                    const est = user.estilo || {};
                    // Fondo a pantalla completa: el fondo comprado tiñe toda la página (con un degradado para que se lea el contenido)
                    let fp = document.getElementById('pp-fondo');
                    if (est.fondo) { if (!fp) { fp = document.createElement('div'); fp.id = 'pp-fondo'; fp.setAttribute('aria-hidden', 'true'); document.body.prepend(fp); } fp.className = 'pp-fondo ugs-f-' + est.fondo; document.body.classList.add('pp-con-fondo'); }
                    document.querySelector('.hero-avatar-wrap')?.classList.toggle('pp-marco-xl', !!est.marco);
                    document.querySelector('.hero-username')?.classList.toggle('pp-nombre-xl', !!est.color);
                    // Vitrina de insignias: todas las que tiene (equipadas primero)
                    const col = user.coleccion || {}, todas = [...new Set([...(est.insignias || []), ...(col.insignias || [])])];
                    const cat = window.UGX.cfg?.cosmeticos || [];
                    let vit = document.getElementById('pp-vitrina');
                    if (todas.length || col.total) {
                        if (!vit) { vit = document.createElement('section'); vit.id = 'pp-vitrina'; vit.className = 'pp-vitrina'; document.getElementById('hero-info')?.after(vit); }
                        vit.innerHTML = `<div class="pp-vitrina-h"><b>🏅 Vitrina</b><small>${col.total || todas.length} artículo${(col.total || todas.length) === 1 ? '' : 's'} de colección</small></div>
                          <div class="pp-vitrina-l">${todas.map(id => { const c = cat.find(x => x.id === id); if (!c) return ''; const eq = (est.insignias || []).includes(id);
                            return `<div class="pp-ins${eq ? ' eq' : ''}${c.soloMision ? ' unica' : ''}" title="${c.soloMision ? 'Exclusiva: no se vende' : 'Insignia de colección'}"><span>${c.emoji}</span><b>${String(c.nombre).replace(/[<>&"]/g, '')}</b>${c.soloMision ? '<small>Exclusiva</small>' : ''}</div>`; }).join('')}</div>`;
                    }
                };
                window.UGX?.cargarCfg().then(pintarEstilo);
                // Regalar Premium a este creador (con UpCoins)
                if (!esMiPerfil && usuarioActual && !document.getElementById('pp-regalar')) {
                    window.UGX?.cargarCfg().then(c => {
                        if (!c?.activo?.regalarPremium) return;
                        const b = document.createElement('button'); b.id = 'pp-regalar'; b.type = 'button'; b.className = 'btn-seguir';
                        b.style.cssText = 'background:linear-gradient(135deg,#ffcc4d,#ff9a3c);color:#2b1a00;border:0';
                        b.innerHTML = '🎁 Regalar'; b.title = 'Regalar Premium con UpCoins'; b.onclick = () => window.UGX.regalar(user.usuario);
                        document.getElementById('btn-seguir')?.after(b);
                    });
                }

                // Biografía
                document.getElementById('user-bio').textContent = user.bio || 'Sin biografía';
                // SEO: título y descripción propios de cada creador
                try {
                    document.title = `@${user.usuario || usuarioViendo} — Juegos, mods y apps | UpGames`;
                    const md = document.querySelector('meta[name="description"]');
                    if (md) md.setAttribute('content', `Publicaciones de @${user.usuario || usuarioViendo} en UpGames${user.bio ? ': ' + String(user.bio).slice(0, 120) : ''}. Descarga gratis y síguelo para no perderte nada.`);
                    let c = document.querySelector('link[rel="canonical"]');
                    if (!c) { c = document.createElement('link'); c.rel = 'canonical'; document.head.appendChild(c); }
                    c.href = `https://upgames.games/public/perfil-publico.html?usuario=${encodeURIComponent(user.usuario || usuarioViendo)}`;
                } catch (_) {}

                // ¿Está en vivo ahora? → aviso que lleva a su directo
                fetch(`${API_URL}/live/canal/${encodeURIComponent(user.usuario)}`).then(r => r.ok ? r.json() : null).then(d => {
                    if (!d?.live) return;
                    const a = document.createElement('a');
                    a.href = `./live.html?u=${encodeURIComponent(user.usuario)}`;
                    a.className = 'pp-live-banner';
                    a.innerHTML = '<span class="pp-live-dot"></span><b>EN VIVO</b><span class="pp-live-t"></span><span>Ver ahora ›</span>';
                    a.querySelector('.pp-live-t').textContent = d.live.titulo || '';
                    const bio = document.getElementById('user-bio');
                    bio.parentNode.insertBefore(a, bio);
                }).catch(() => {});

                // Estadísticas
                document.getElementById('stat-uploads').textContent = user.publicaciones || 0;
                document.getElementById('stat-followers').textContent = user.seguidores || 0;
                document.getElementById('stat-following').textContent = user.siguiendo || 0;

                // Cargar publicaciones
                await cargarPublicaciones();

                // Verificar seguimiento
                if (usuarioActual) {
                    await verificarSeguimiento();
                } else {
                    configurarBotonSeguir(false);
                }

            } catch (error) {
                console.error("❌ Error cargando perfil:", error);
                mostrarError('Error al cargar perfil', error.message);
            }
        }

        // ── Sub-nav switch ──
        function pubSwitchTab(tab, el) {
            document.querySelectorAll('.pub-subnav-tab').forEach(t => t.classList.remove('active'));
            if(el) el.classList.add('active');
            document.getElementById('pub-panel-publicaciones').classList.toggle('active', tab === 'publicaciones');
            document.getElementById('pub-panel-videos').classList.toggle('active', tab === 'videos');
        }

        // ✅ CARGAR PUBLICACIONES — separadas en Juegos y Videos
        async function cargarPublicaciones() {
            try {
                const response = await fetchAPI(`${API_URL}/items/user/${usuarioViendo}`);

                const esAutor = usuarioActual && usuarioActual.toLowerCase() === usuarioViendo.toLowerCase();
                const todos = Array.isArray(response)
                    ? (esAutor ? response : response.filter(item => item.status === 'aprobado'))
                    : [];

                // Lo más reciente primero (como Instagram/TikTok)
                todos.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                const juegos = todos.filter(i => i.category !== 'Video');
                const videos = todos.filter(i => i.category === 'Video');

                console.log(`📦 Publicaciones de ${usuarioViendo}: ${juegos.length} juegos, ${videos.length} videos`);

                // Actualizar contadores del sub-nav
                document.getElementById('pub-subnav-count-pub').textContent = juegos.length;
                document.getElementById('pub-subnav-count-vid').textContent = videos.length;

                // Actualizar contador del header (total)
                const total = todos.length;
                const countEl = document.getElementById('pub-count');
                if(countEl) countEl.textContent = total > 0 ? `${total} resultados` : '';


                // ── Renderizar JUEGOS ──
                const contJuegos = document.getElementById('user-items');
                if(!juegos.length) {
                    contJuegos.innerHTML = `
                        <div class="empty-msg">
                            <ion-icon name="cloud-offline-outline"></ion-icon>
                            <h3>Sin publicaciones</h3>
                            <p>Este usuario aún no ha publicado nada.</p>
                        </div>`;
                } else {
                    contJuegos.innerHTML = juegos.map(ppTile).join('');
                }

                // ── Renderizar VIDEOS ──
                const contVideos = document.getElementById('user-videos');
                if(!videos.length) {
                    contVideos.innerHTML = `
                        <div class="empty-msg">
                            <ion-icon name="videocam-off-outline"></ion-icon>
                            <h3>Sin videos</h3>
                            <p>Este usuario aún no ha publicado videos.</p>
                        </div>`;
                } else {
                    contVideos.innerHTML = videos.map(ppTile).join('');
                }

            } catch (error) {
                console.error("❌ Error cargando publicaciones:", error);
                document.getElementById('user-items').innerHTML = `
                    <div class="empty-msg">
                        <ion-icon name="warning-outline"></ion-icon>
                        <h3>Error</h3>
                        <p>No se pudieron cargar las publicaciones</p>
                    </div>`;
            }
        }

        // ✅ VERIFICAR SEGUIMIENTO
        async function verificarSeguimiento() {
            const btnSeguir = document.getElementById('btn-seguir');
            
            // Si es el mismo usuario
            if (usuarioActual && usuarioActual.toLowerCase() === usuarioViendo.toLowerCase()) {
                btnSeguir.innerHTML = `<ion-icon name="person-circle-outline"></ion-icon> Tu perfil`;
                btnSeguir.disabled = true;
                btnSeguir.style.opacity = '0.5';
                return;
            }

            // Si no hay usuario logueado
            if (!usuarioActual) {
                configurarBotonSeguir(false);
                return;
            }

            try {
                const response = await fetchAPI(
                    `${API_URL}/usuarios/verifica-seguimiento/${usuarioActual}/${usuarioViendo}`
                );
                
                configurarBotonSeguir(response.estaSiguiendo || false);

            } catch (error) {
                console.error("❌ Error verificando seguimiento:", error);
                configurarBotonSeguir(false);
            }
        }

        // ✅ CONFIGURAR BOTÓN DE SEGUIR
        function configurarBotonSeguir(estaSiguiendo) {
            const btnSeguir  = document.getElementById('btn-seguir');
            const btnMensaje = document.getElementById('btn-mensaje');
            
            if (!usuarioActual) {
                // Invitado: el perfil se ve completo; seguir pide cuenta y luego vuelve aquí
                btnSeguir.innerHTML = `<ion-icon name="person-add-outline"></ion-icon> Seguir`;
                btnSeguir.onclick = () => window.location.href = `../index.html?volver=${encodeURIComponent('./public/perfil-publico.html' + location.search.replace(/[^\w=&%.~+?-]/g, ''))}` + '&registro=1';
                btnSeguir.disabled = false;
                btnSeguir.className = 'btn-seguir';
                if (btnMensaje) btnMensaje.style.display = 'none';
                return;
            }

            btnSeguir.disabled = false;
            
            if (estaSiguiendo) {
                btnSeguir.innerHTML = `<ion-icon name="checkmark-circle-outline"></ion-icon> Siguiendo`;
                btnSeguir.className = 'btn-seguir btn-siguiendo';
                btnSeguir.onclick = dejarDeSeguir;
                // Mostrar botón de mensaje
                if (btnMensaje) btnMensaje.style.display = 'inline-flex';
            } else {
                btnSeguir.innerHTML = `<ion-icon name="person-add-outline"></ion-icon> Seguir`;
                btnSeguir.className = 'btn-seguir';
                btnSeguir.onclick = seguirUsuario;
                // Ocultar botón de mensaje
                if (btnMensaje) btnMensaje.style.display = 'none';
            }
        }

        // ✅ ABRIR CHAT
        function abrirChat() {
            if (!usuarioActual || !usuarioViendo) return;
            window.location.href = `./chats.html?usuario=${encodeURIComponent(usuarioViendo)}`;
        }

        // ✅ SEGUIR USUARIO
        async function seguirUsuario() {
            if (!usuarioActual) {
                window.location.href = `../index.html?volver=${encodeURIComponent('./public/perfil-publico.html' + location.search.replace(/[^\w=&%.~+?-]/g, ''))}`;
                return;
            }

            const btnSeguir = document.getElementById('btn-seguir');
            const originalContent = btnSeguir.innerHTML;
            btnSeguir.disabled = true;
            btnSeguir.innerHTML = `<ion-icon name="hourglass-outline"></ion-icon> Procesando...`;

            try {
                const _tkn = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/usuarios/toggle-seguir/${usuarioActual}/${usuarioViendo}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${_tkn}` }
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.siguiendo) {
                        try { const g = JSON.parse(localStorage.getItem('ug_guia') || '{}'); if (!g.seguir) { g.seguir = Date.now(); localStorage.setItem('ug_guia', JSON.stringify(g)); } } catch (_) {}   // guía de inicio
                        alert(`✅ Ahora sigues a @${usuarioViendo}`);
                    }
                    await cargarPerfilUsuario();
                } else if (response.status === 401) {
                    // Sesión expirada — limpiar y redirigir con aviso claro
                    localStorage.clear();
                    alert('Tu sesión expiró. Por favor vuelve a iniciar sesión.');
                    window.location.replace('../index.html');
                } else {
                    throw new Error(data.error || "Error al seguir");
                }
            } catch (error) {
                console.error("❌ Error:", error);
                alert(error.message || "Error de conexión");
                btnSeguir.disabled = false;
                btnSeguir.innerHTML = originalContent;
            }
        }

        // ✅ DEJAR DE SEGUIR
        async function dejarDeSeguir() {
            if (!confirm(`¿Dejar de seguir a @${usuarioViendo}?`)) return;
            
            const btnSeguir = document.getElementById('btn-seguir');
            const originalContent = btnSeguir.innerHTML;
            btnSeguir.disabled = true;
            btnSeguir.innerHTML = `<ion-icon name="hourglass-outline"></ion-icon> Procesando...`;

            try {
                const _tkn2 = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/usuarios/toggle-seguir/${usuarioActual}/${usuarioViendo}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${_tkn2}` }
                });

                const data = await response.json();

                if (response.ok) {
                    if (!data.siguiendo) {
                        alert(`💔 Dejaste de seguir a @${usuarioViendo}`);
                    }
                    await cargarPerfilUsuario();
                } else if (response.status === 401) {
                    localStorage.clear();
                    alert('Tu sesión expiró. Por favor vuelve a iniciar sesión.');
                    window.location.replace('../index.html');
                } else {
                    throw new Error(data.error || "Error al dejar de seguir");
                }
            } catch (error) {
                console.error("❌ Error:", error);
                alert(error.message || "Error de conexión");
                btnSeguir.disabled = false;
                btnSeguir.innerHTML = originalContent;
            }
        }

        // ✅ MOSTRAR ERROR
        function mostrarError(titulo, mensaje) {
            document.querySelector('.container').innerHTML = `
                <div style="padding:0 12px">
                    <div class="empty-msg">
                        <ion-icon name="alert-circle-outline" style="color:var(--danger);opacity:1;"></ion-icon>
                        <h3>${titulo}</h3>
                        <p>${mensaje}</p>
                        <button class="btn-volver-inicio" onclick="location.href='./biblioteca.html'">
                            <ion-icon name="arrow-back-outline"></ion-icon>
                            Volver al inicio
                        </button>
                    </div>
                </div>
            `;
        }

        // ✅ INICIALIZAR
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🚀 Inicializando perfil público...");
            cargarPerfilUsuario();
        });
    </script>
</body>
</html>
