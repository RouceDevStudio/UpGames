<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B0F">
  <title>Mensajes · UpGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ══════════════════════════════════════════════════════════════════
   UpGames · Mensajes — Liquid Glass
   ══════════════════════════════════════════════════════════════════ */
:root {
  --g: #32D583; --g-rgb: 50,213,131;
  --cy: #5AC8FA; --cy-rgb: 90,200,250;
  --bg: #0A0B0F; --bg-rgb: 10,11,15;
  --bg1: #111318; --bg2: #171A21; --bg3: #1F232C;
  --glass: rgba(23,26,33,.62); --glass-2: rgba(31,35,44,.72);
  --bd: rgba(255,255,255,.08); --bd-2: rgba(255,255,255,.14);
  --txt: #F4F5F7; --txt2: #A3A8B6; --txt3: #6C7180;
  --red: #ff5a5a; --amber: #ffcc00;
  --ff: 'Manrope', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.22,1,.36,1);
  --r: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--ff); color: var(--txt); background: var(--bg);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
/* Fondo con luces suaves detrás del vidrio */
body::before, body::after {
  content: ''; position: fixed; z-index: 0; pointer-events: none; border-radius: 50%; filter: blur(80px);
}
body::before { width: 520px; height: 520px; top: -180px; left: -160px; background: rgba(var(--g-rgb), .16); }
body::after  { width: 480px; height: 480px; bottom: -200px; right: -140px; background: rgba(var(--cy-rgb), .13); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
ion-icon { pointer-events: none; }
.glass {
  background: var(--glass);
  backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid var(--bd);
}
.ico-btn {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--txt2); font-size: 1.25rem; position: relative;
  transition: background .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
}
.ico-btn:hover { background: rgba(255,255,255,.06); color: var(--txt); }
.ico-btn:active { transform: scale(.92); }
.ico-btn.on { color: var(--g); }
.dot-badge { position: absolute; top: 4px; right: 4px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px; background: var(--g); color: #06210f; font-size: .6rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }

/* ── Layout ───────────────────────────────────────────── */
.app { position: relative; z-index: 1; height: 100dvh; display: grid; grid-template-columns: 360px 1fr; max-width: 1280px; margin: 0 auto; }
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--bd); background: rgba(var(--bg-rgb), .55); }
.main { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .main { position: fixed; inset: 0; z-index: 20; background: var(--bg); transform: translateX(100%); transition: transform .32s var(--ease); }
  .app.chat-open .main { transform: none; }
  .app.chat-open .side { visibility: hidden; transition: visibility 0s .32s; }
}

/* ── Barra lateral ────────────────────────────────────── */
.side-hdr { display: flex; align-items: center; gap: 6px; padding: 14px 12px 10px 14px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-decoration: none; color: inherit; }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--g), var(--cy)); color: #06210f; font-size: 1.1rem; box-shadow: 0 6px 18px rgba(var(--g-rgb), .3); }
.brand-txt { display: flex; flex-direction: column; line-height: 1.1; }
.brand-txt b { font-size: 1.12rem; font-weight: 800; letter-spacing: -.2px; }
.brand-txt small { font-size: .66rem; font-weight: 700; color: var(--txt3); letter-spacing: .4px; }
.brand-txt small em { font-style: normal; color: var(--g); }
.search { margin: 2px 12px 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 42px; border-radius: 14px; }
.search ion-icon { color: var(--txt3); font-size: 1rem; }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: .86rem; }
.search input::placeholder { color: var(--txt3); }
.search:focus-within { border-color: rgba(var(--g-rgb), .45); }
.chips { display: flex; gap: 6px; padding: 0 12px 10px; overflow-x: auto; scrollbar-width: none; }
.chip { flex-shrink: 0; padding: 6px 12px; border-radius: 99px; font-size: .74rem; font-weight: 700; color: var(--txt2); border: 1px solid var(--bd); background: rgba(255,255,255,.03); transition: all .18s var(--ease); }
.chip.on { color: #06210f; background: var(--g); border-color: var(--g); }
.chip .n { margin-left: 4px; opacity: .8; }
.list { flex: 1; overflow-y: auto; padding: 2px 8px 14px; overscroll-behavior: contain; }
.list::-webkit-scrollbar, .msgs::-webkit-scrollbar { width: 6px; }
.list::-webkit-scrollbar-thumb, .msgs::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 6px; }
.sec { padding: 14px 8px 6px; font-size: .64rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--txt3); }
.conv { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; cursor: pointer; position: relative; transition: background .16s var(--ease); width: 100%; text-align: left; }
.conv:hover { background: rgba(255,255,255,.04); }
.conv.on { background: rgba(var(--g-rgb), .1); }
.conv-body { flex: 1; min-width: 0; }
.conv-top { display: flex; align-items: baseline; gap: 6px; }
.conv-name { font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-time { margin-left: auto; font-size: .68rem; color: var(--txt3); flex-shrink: 0; }
.conv-prev { margin-top: 2px; display: flex; align-items: center; gap: 4px; font-size: .79rem; color: var(--txt2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-prev span { overflow: hidden; text-overflow: ellipsis; }
.conv-prev ion-icon { flex-shrink: 0; font-size: .9rem; }
.conv.unread .conv-name { color: var(--txt); }
.conv.unread .conv-prev { color: var(--txt); font-weight: 600; }
.conv.unread .conv-time { color: var(--g); font-weight: 700; }
.conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.conv-flags { display: flex; gap: 3px; color: var(--txt3); font-size: .78rem; }
.unread-n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--g); color: #06210f; font-size: .66rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.empty-list { padding: 40px 18px; text-align: center; color: var(--txt2); font-size: .84rem; line-height: 1.5; }
.empty-list .big { font-size: 2.2rem; margin-bottom: 10px; }
.empty-list .btn { margin-top: 14px; }
.skel { height: 64px; margin: 4px 2px; border-radius: 16px; background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.07), rgba(255,255,255,.03)); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Avatares */
.av { position: relative; flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--g), var(--cy)); color: #06210f; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.av.sm { width: 36px; height: 36px; font-size: .85rem; }
.av.xs { width: 28px; height: 28px; font-size: .7rem; }
.av .on-dot { position: absolute; right: 0; bottom: 1px; width: 13px; height: 13px; border-radius: 50%; background: var(--g); border: 2.5px solid var(--bg); box-shadow: 0 0 8px rgba(var(--g-rgb), .7); z-index: 1; }
.av.sm .on-dot { width: 11px; height: 11px; border-width: 2px; }
.vbadge { color: var(--cy); font-size: .9rem; flex-shrink: 0; }
.vbadge.lv2 { color: #f5c542; } .vbadge.lv3 { color: var(--g); }

/* ── Panel de chat ────────────────────────────────────── */
.chat-hdr { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 8px; border-bottom: 1px solid var(--bd); background: rgba(var(--bg-rgb), .7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 3; }
.chat-who { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-align: left; padding: 4px 6px; border-radius: 12px; }
.chat-who:hover { background: rgba(255,255,255,.04); }
.who-txt { min-width: 0; }
.who-name { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: .95rem; }
.who-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who-sub { font-size: .72rem; color: var(--txt3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-sub.live { color: var(--g); }
.back-btn { display: none; }
@media (max-width: 760px) { .back-btn { display: inline-flex; } }

.in-search { display: none; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--bd); background: rgba(var(--bg-rgb), .7); }
.in-search.show { display: flex; }
.in-search input { flex: 1; background: var(--bg2); border: 1px solid var(--bd); border-radius: 10px; padding: 8px 10px; outline: 0; font-size: .84rem; }
.in-search small { font-size: .72rem; color: var(--txt3); min-width: 44px; text-align: center; }

.msgs { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; overscroll-behavior: contain; scroll-behavior: auto; }
.load-older { align-self: center; margin: 4px 0 12px; padding: 6px 14px; border-radius: 99px; font-size: .74rem; font-weight: 700; color: var(--txt2); border: 1px solid var(--bd); background: var(--glass); }
.day { align-self: center; margin: 14px 0 8px; padding: 4px 12px; border-radius: 99px; font-size: .68rem; font-weight: 700; color: var(--txt2); background: rgba(255,255,255,.05); border: 1px solid var(--bd); text-transform: capitalize; }
.row { display: flex; align-items: flex-end; gap: 6px; margin-top: 2px; max-width: 100%; }
.row.first { margin-top: 10px; }
.row.mine { justify-content: flex-end; }
.row .av-slot { width: 28px; flex-shrink: 0; }
.bwrap { position: relative; display: flex; flex-direction: column; max-width: min(76%, 520px); }
.row.mine .bwrap { align-items: flex-end; }
.bubble {
  position: relative; padding: 8px 12px 6px; border-radius: 18px; font-size: .9rem; line-height: 1.42;
  background: var(--glass-2); border: 1px solid var(--bd); word-wrap: break-word; overflow-wrap: anywhere;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: transform .15s var(--ease), box-shadow .2s;
}
.row:not(.mine) .bubble { border-bottom-left-radius: 6px; }
.row:not(.mine).cont .bubble { border-top-left-radius: 6px; }
.row.mine .bubble { background: linear-gradient(135deg, rgba(var(--g-rgb), .9), rgba(43,190,160,.9)); color: #04170c; border-color: transparent; border-bottom-right-radius: 6px; }
.row.mine.cont .bubble { border-top-right-radius: 6px; }
.bubble a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.row:not(.mine) .bubble a { color: var(--cy); }
.bubble .txt { white-space: pre-wrap; }
.bubble.jumbo { background: none !important; border: 0; padding: 2px 4px; font-size: 2.4rem; line-height: 1.15; backdrop-filter: none; }
.bubble.deleted { font-style: italic; color: var(--txt3) !important; background: transparent !important; border: 1px dashed var(--bd-2) !important; }
.bubble.hl { box-shadow: 0 0 0 2px var(--amber); }
.bubble mark { background: rgba(255,204,0,.45); color: inherit; border-radius: 3px; }
.meta { display: inline-flex; align-items: center; gap: 3px; float: right; margin: 6px 0 -2px 10px; font-size: .64rem; opacity: .75; white-space: nowrap; }
.row.mine .meta { color: #063018; opacity: .85; }
.meta ion-icon { font-size: .86rem; }
.meta .seen { color: #0b5ed7; }
.row:not(.mine) .meta { color: var(--txt3); }
.bimg { display: block; margin: -2px -6px 6px; border-radius: 13px; overflow: hidden; cursor: zoom-in; max-width: 280px; background: rgba(0,0,0,.2); }
.bimg img { display: block; width: 100%; max-height: 340px; object-fit: cover; }
.bubble.only-img { padding: 4px 4px 4px; }
.bubble.only-img .bimg { margin: 0; }
.bubble.only-img .meta { position: absolute; right: 10px; bottom: 9px; margin: 0; padding: 2px 7px; border-radius: 99px; background: rgba(0,0,0,.45); color: #fff; opacity: 1; float: none; }
.quote { display: block; text-align: left; margin: 0 -4px 6px; padding: 6px 9px; border-radius: 10px; border-left: 3px solid var(--cy); background: rgba(0,0,0,.18); font-size: .76rem; line-height: 1.3; cursor: pointer; max-width: 100%; }
.row.mine .quote { border-left-color: #063018; background: rgba(0,0,0,.12); }
.quote b { display: block; font-size: .72rem; margin-bottom: 1px; }
.quote span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; opacity: .85; }
.card-link { display: flex; gap: 10px; align-items: center; margin: 6px -4px 2px; padding: 8px; border-radius: 12px; background: rgba(0,0,0,.2); text-decoration: none !important; color: inherit !important; }
.card-link img { width: 52px; height: 52px; border-radius: 9px; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,.06); }
.card-link b { display: block; font-size: .8rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-link small { font-size: .68rem; opacity: .75; }
.reacts { display: flex; gap: 2px; margin-top: -6px; z-index: 1; padding: 2px 6px; border-radius: 99px; background: var(--bg2); border: 1px solid var(--bd); font-size: .78rem; cursor: pointer; align-self: flex-start; }
.row.mine .reacts { align-self: flex-end; }
.reacts small { font-size: .66rem; color: var(--txt2); margin-left: 2px; }
.reacts .me { filter: drop-shadow(0 0 4px rgba(var(--g-rgb), .9)); }
.more-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; display: none; align-items: center; justify-content: center; color: var(--txt2); background: var(--bg2); border: 1px solid var(--bd); }
.row:not(.mine) .more-btn { right: -34px; } .row.mine .more-btn { left: -34px; }
@media (hover: hover) { .row:hover .more-btn { display: inline-flex; } }
.typing { align-self: flex-start; display: none; gap: 4px; margin: 10px 0 2px 34px; padding: 11px 14px; border-radius: 18px; border-bottom-left-radius: 6px; background: var(--glass-2); border: 1px solid var(--bd); }
.typing.show { display: inline-flex; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--txt2); animation: tp 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes tp { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.new-row { animation: rin .26s var(--ease); }
@keyframes rin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.to-bottom { position: absolute; right: 16px; bottom: calc(86px + var(--safe-b)); width: 42px; height: 42px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--txt); z-index: 4; box-shadow: 0 8px 22px rgba(0,0,0,.4); }
.to-bottom.show { display: inline-flex; }

/* Compositor */
.composer { padding: 8px 10px calc(10px + var(--safe-b)); border-top: 1px solid var(--bd); background: rgba(var(--bg-rgb), .75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 3; }
.ctx-bar { display: none; align-items: center; gap: 10px; margin: 0 2px 8px; padding: 8px 10px; border-radius: 12px; border-left: 3px solid var(--cy); background: var(--bg2); }
.ctx-bar.show { display: flex; }
.ctx-bar.edit { border-left-color: var(--amber); }
.ctx-bar div { flex: 1; min-width: 0; font-size: .76rem; }
.ctx-bar b { display: block; color: var(--cy); font-size: .72rem; }
.ctx-bar.edit b { color: var(--amber); }
.ctx-bar span { display: block; color: var(--txt2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctx-bar img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
.comp-row { display: flex; align-items: flex-end; gap: 6px; }
.input-wrap { flex: 1; display: flex; align-items: flex-end; min-height: 44px; border-radius: 22px; padding: 2px 4px 2px 14px; }
.input-wrap:focus-within { border-color: rgba(var(--g-rgb), .45); }
.input-wrap textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; max-height: 132px; padding: 11px 0; font-size: .92rem; line-height: 1.35; }
.input-wrap textarea::placeholder { color: var(--txt3); }
.input-wrap .ico-btn { width: 38px; height: 38px; margin-bottom: 1px; }
.send { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 1.25rem; background: linear-gradient(135deg, var(--g), var(--cy)); color: #04170c; box-shadow: 0 6px 18px rgba(var(--g-rgb), .35); transition: transform .12s var(--ease), opacity .2s; }
.send:disabled { opacity: .4; box-shadow: none; cursor: default; }
.send:not(:disabled):active { transform: scale(.9); }
.locked { display: none; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; font-size: .8rem; color: var(--txt2); }
.locked.show { display: flex; }
.locked ion-icon { font-size: 1.3rem; color: var(--amber); flex-shrink: 0; }
.locked div { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 12px; font-weight: 700; font-size: .8rem; border: 1px solid var(--bd); background: var(--bg2); }
.btn:hover { background: var(--bg3); }
.btn.pri { background: var(--g); border-color: var(--g); color: #06210f; }
.btn.danger { color: var(--red); }

/* Emoji */
.emoji-pop { position: absolute; left: 10px; bottom: calc(70px + var(--safe-b)); width: min(340px, calc(100% - 20px)); border-radius: 18px; padding: 8px; display: none; z-index: 6; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.emoji-pop.show { display: block; animation: pop .18s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
.e-tabs { display: flex; gap: 2px; padding-bottom: 6px; border-bottom: 1px solid var(--bd); }
.e-tab { flex: 1; padding: 6px 0; border-radius: 10px; font-size: 1.1rem; opacity: .55; }
.e-tab.on { opacity: 1; background: rgba(255,255,255,.06); }
.e-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; max-height: 210px; overflow-y: auto; padding-top: 6px; }
.e-grid button { aspect-ratio: 1; border-radius: 8px; font-size: 1.35rem; }
.e-grid button:hover { background: rgba(255,255,255,.08); }

/* Estado vacío del panel */
.welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 30px; text-align: center; color: var(--txt2); }
.welcome .orb { width: 86px; height: 86px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; color: #06210f; background: linear-gradient(135deg, var(--g), var(--cy)); box-shadow: 0 18px 50px rgba(var(--g-rgb), .3); margin-bottom: 6px; }
.welcome h2 { color: var(--txt); font-size: 1.25rem; }
.welcome p { max-width: 340px; font-size: .86rem; line-height: 1.5; }
.chat-empty { margin: auto; text-align: center; color: var(--txt2); font-size: .84rem; padding: 30px 10px; }
.chat-empty .big { font-size: 2.6rem; margin-bottom: 8px; }

/* Hojas, menús, modal, toast, lightbox */
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
.ov.show { opacity: 1; pointer-events: auto; }
@media (min-width: 761px) { .ov { align-items: center; } }
.sheet { width: 100%; max-width: 440px; max-height: 86dvh; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; padding: 8px 0 calc(10px + var(--safe-b)); transform: translateY(24px); transition: transform .28s var(--ease); }
@media (min-width: 761px) { .sheet { border-radius: 22px; } }
.ov.show .sheet { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--bd-2); margin: 4px auto 10px; }
.sheet h3 { padding: 0 18px 10px; font-size: 1rem; }
.sheet .search { margin: 0 14px 8px; }
.sheet .list { padding: 0 8px; }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 18px; font-size: .9rem; font-weight: 600; text-align: left; }
.menu-item:hover { background: rgba(255,255,255,.05); }

<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════
   CONFIG Y ESTADO
   ══════════════════════════════════════════════════════════════════ */
const API   = (window.UG_CONFIG && window.UG_CONFIG.API_URL) || 'https://upgames-production.up.railway.app';
const ME    = (localStorage.getItem('user_admin') || '').toLowerCase();
const TOKEN = localStorage.getItem('token') || '';
if (!ME || !TOKEN) location.replace('../index.html');

const REACTS = ['❤️', '😂', '😮', '😢', '👍', '🔥'];
const S = {
  convs: [], filter: 'todos', q: '',
  contact: null, info: null,        // contacto abierto y su relación
  msgs: new Map(), order: [],        // mensajes por id + orden
  cursor: 0, hayMas: false, loadingOlder: false,
  reply: null, edit: null, pendingImg: null,
  unseenBelow: 0, poll: null, listPoll: null, typingSent: 0,
  hits: [], hitIdx: -1, contactos: null,
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};
let pinned = new Set(LS.get('ugc_pinned', []));
let muted  = new Set(LS.get('ugc_muted', []));
let soundOn = LS.get('ugc_sound', true);

/* ── Utilidades ───────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const H = () => ({ 'Content-Type': 'application/json', Authorization: `Bearer ${TOKEN}` });
const isMobile = () => window.innerWidth <= 760;
async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { ...H(), ...(opts.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) {
    // Sesión caducada: borrarla, o el login vería el token viejo y rebotaría a la biblioteca
    try { localStorage.removeItem('token'); localStorage.removeItem('user_admin'); } catch (_) {}
    toast('Tu sesión expiró. Inicia sesión de nuevo'); setTimeout(() => location.replace('../index.html'), 1600); throw new Error('401');
  }
  if (!r.ok || d.success === false) { const e = new Error(d.error || 'Error de conexión'); e.code = d.code; e.status = r.status; throw e; }
  return d;
}
function cld(url, t) {          // Cloudinary: tamaño justo + formato automático
  const u = String(url || '');
  if (!/^https:\/\/res\.cloudinary\.com\/[^/]+\/image\/upload\//.test(u)) return u;
  if (/\/image\/upload\/(?!v\d+\/)[a-z]{1,3}_[^/]*\//.test(u)) return u;
  return u.replace('/image/upload/', `/image/upload/${t}/`);
}
function avatarHTML(user, avatar, online, cls = '') {
  const img = avatar && /^https:\/\//.test(avatar) ? `<img src="${esc(cld(avatar, 'c_fill,g_face,w_120,h_120,q_auto,f_auto'))}" alt="" loading="lazy" onerror="this.remove()">` : '';
  return `<span class="av ${cls}">${esc((user || '?')[0].toUpperCase())}${img}${online ? '<span class="on-dot"></span>' : ''}</span>`;
}
const badgeHTML = n => n > 0 ? `<ion-icon class="vbadge lv${n}" name="${n >= 3 ? 'checkmark-done-circle' : 'checkmark-circle'}"></ion-icon>` : '';
function fmtList(iso) {
  const d = new Date(iso), n = new Date(), diff = n - d;
  if (diff < 60000) return 'ahora';
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  const ay = new Date(n); ay.setDate(n.getDate() - 1);
  if (d.toDateString() === ay.toDateString()) return 'ayer';
  if (diff < 6 * 864e5) return d.toLocaleDateString('es', { weekday: 'short' });
  return d.toLocaleDateString('es', { day: '2-digit', month: '2-digit' });
}
const fmtHora = iso => new Date(iso).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
function fmtDia(iso) {
  const d = new Date(iso), n = new Date(), ay = new Date(n); ay.setDate(n.getDate() - 1);
  if (d.toDateString() === n.toDateString()) return 'Hoy';
  if (d.toDateString() === ay.toDateString()) return 'Ayer';
  return d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', ...(d.getFullYear() !== n.getFullYear() ? { year: 'numeric' } : {}) });
}
function fmtVisto(iso) {
  if (!iso) return 'Desconectado';
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 3600e3) return `Activo hace ${Math.max(1, Math.round(diff / 60000))} min`;
  if (diff < 864e5) return `Activo hace ${Math.round(diff / 3600e3)} h`;
  return `Visto ${fmtList(iso)}`;
}
function toast(msg, ms = 2600) {
  const t = document.createElement('div');
  t.className = 'toast glass'; t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 220); }, ms);
}
function openOv(id) { $(id).classList.add('show'); }
function closeOv(id) { $(id).classList.remove('show'); }
function confirmar(ico, title, body, okTxt, cb, danger) {
  $('m-ico').textContent = ico; $('m-title').textContent = title; $('m-body').innerHTML = body;
  const ok = $('m-ok'); ok.textContent = okTxt; ok.className = 'btn ' + (danger ? 'danger' : 'pri');
  ok.onclick = () => { closeOv('ov-modal'); cb(); };
  openOv('ov-modal');
}
/* Texto → HTML seguro con enlaces */
const URL_RE = /\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/gi;
function linkify(text) {
  return esc(text).replace(URL_RE, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u.length > 60 ? u.slice(0, 57) + '…' : u}</a>`);
}
const soloEmoji = t => /^(\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️|\s){1,12}$/u.test(t) && !/\d/.test(t) && t.trim().length <= 12;

/* Sonido corto al recibir (Web Audio, sin archivos) */
let actx = null;
function ping() {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, actx.currentTime); o.frequency.exponentialRampToValueAtTime(1320, actx.currentTime + .08);
    g.gain.setValueAtTime(.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(.12, actx.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + .25);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .26);
  } catch (_) {}
}
function toggleSound() { soundOn = !soundOn; LS.set('ugc_sound', soundOn); paintSound(); toast(soundOn ? '🔔 Sonido activado' : '🔕 Sonido desactivado'); }
function paintSound() { const b = $('btn-sound'); b.innerHTML = `<ion-icon name="${soundOn ? 'volume-high-outline' : 'volume-mute-outline'}"></ion-icon>`; }

/* ══════════════════════════════════════════════════════════════════
   LISTA DE CONVERSACIONES
   ══════════════════════════════════════════════════════════════════ */
let lastUnreadTotal = -1;
async function loadConvs() {
  try {
    const d = await api('/chat/conversaciones');
    const antes = new Map(S.convs.map(c => [c.contacto, c]));
    S.convs = d.conversaciones || [];
    // Sonido si llega algo nuevo a un chat que no está abierto (ni silenciado)
    S.convs.forEach(c => {
      const prev = antes.get(c.contacto);
      if (prev && c.noLeidos > prev.noLeidos && c.contacto !== S.contact && !muted.has(c.contacto)) { ping(); notificar(c); }
    });
    renderConvs();
  } catch (e) { if (e.message !== '401' && !S.convs.length) $('list').innerHTML = `<div class="empty-list"><div class="big">📡</div>No se pudieron cargar tus chats.<br><button class="btn" onclick="loadConvs()">Reintentar</button></div>`; }
}
function setFilter(f) {
  S.filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.f === f));
  renderConvs();
}
function renderConvs() {
  const total = S.convs.reduce((n, c) => n + (muted.has(c.contacto) ? 0 : c.noLeidos || 0), 0);
  $('n-unread').textContent = total ? total : '';
  document.title = (total ? `(${total}) ` : '') + 'Mensajes · UpGames';
  lastUnreadTotal = total;
  const q = S.q.toLowerCase();
  let rows = S.convs.filter(c => !q || c.contacto.includes(q));
  if (S.filter === 'noleidos') rows = rows.filter(c => c.noLeidos > 0);
  if (S.filter === 'fijados') rows = rows.filter(c => pinned.has(c.contacto));
  if (S.filter === 'enlinea') rows = rows.filter(c => c.online);
  rows.sort((a, b) => (pinned.has(b.contacto) - pinned.has(a.contacto)) || (new Date(b.ultimoMensaje.fecha) - new Date(a.ultimoMensaje.fecha)));
  const list = $('list');
  const extra = list.querySelector('#search-extra');
  let html = '';
  if (!rows.length) {
    html = S.q ? '' : `<div class="empty-list"><div class="big">${S.filter === 'todos' ? '💬' : '🔎'}</div>${S.filter === 'todos'
      ? 'Aún no tienes conversaciones.<br>Escríbele a alguien que siga tu contenido.<div><button class="btn pri" onclick="openNewChat()">Nuevo mensaje</button></div>'
      : 'No hay chats en este filtro.'}</div>`;
  }
  html += rows.map(c => {
    const u = c.ultimoMensaje || {};
    const mine = u.de === ME;
    let prev = u.borrado ? '<ion-icon name="ban-outline"></ion-icon><span>Mensaje eliminado</span>'
      : u.imagen && !u.texto ? '<ion-icon name="image-outline"></ion-icon><span>Imagen</span>'
      : `<span>${esc(u.texto || '')}</span>`;
    if (mine && !u.borrado) prev = `<ion-icon name="${u.leido ? 'checkmark-done' : 'checkmark'}" style="color:${u.leido ? 'var(--cy)' : 'var(--txt3)'}"></ion-icon>` + prev;
    const unread = c.noLeidos > 0 && !mine;
    return `<button class="conv${unread ? ' unread' : ''}${c.contacto === S.contact ? ' on' : ''}" onclick="openChat('${esc(c.contacto)}')">
      ${avatarHTML(c.contacto, c.avatar, c.online)}
      <span class="conv-body">
        <span class="conv-top"><span class="conv-name">@${esc(c.contacto)}</span>${badgeHTML(c.verificadoNivel)}<span class="conv-time">${u.fecha ? fmtList(u.fecha) : ''}</span></span>
        <span class="conv-prev">${c.bloqueado ? '<ion-icon name="ban-outline"></ion-icon><span>Bloqueado</span>' : prev}</span>
      </span>
      <span class="conv-meta">
        <span class="conv-flags">${pinned.has(c.contacto) ? '<ion-icon name="pin"></ion-icon>' : ''}${muted.has(c.contacto) ? '<ion-icon name="notifications-off"></ion-icon>' : ''}</span>
        ${unread ? `<span class="unread-n" style="${muted.has(c.contacto) ? 'background:var(--txt3)' : ''}">${c.noLeidos > 99 ? '99+' : c.noLeidos}</span>` : ''}
      </span>
    </button>`;
  }).join('');
  list.innerHTML = html;
  if (extra) list.appendChild(extra);
}
let searchTmr = null;
function onSearch(v) {
  S.q = v.trim().toLowerCase().replace(/^@/, '');
  renderConvs();
  clearTimeout(searchTmr);
  $('search-extra')?.remove();
  if (S.q.length >= 2) searchTmr = setTimeout(() => searchUsers(S.q), 350);
}
async function searchUsers(q) {
  try {
    const d = await api(`/usuarios/buscar?q=${encodeURIComponent(q)}`);
    if (S.q !== q) return;
    const ya = new Set(S.convs.map(c => c.contacto));
    const us = (d.usuarios || []).filter(u => !ya.has(u.usuario));
    if (!us.length) { if (!S.convs.some(c => c.contacto.includes(q))) { const el = document.createElement('div'); el.id = 'search-extra'; el.innerHTML = `<div class="empty-list">Nadie con “${esc(q)}”.</div>`; $('list').appendChild(el); } return; }
    const el = document.createElement('div');

/* ══════════════════════════════════════════════════════════════════
   CONVERSACIÓN
   ══════════════════════════════════════════════════════════════════ */
async function openChat(user) {
  user = String(user || '').toLowerCase();
  if (!user || user === ME) return;
  if (S.contact === user && !$('chat').classList.contains('hidden')) return;
  stopPoll(); clearCtx(); closeEmoji(); toggleInSearch(false);
  S.contact = user; S.info = null; S.msgs.clear(); S.order = []; S.cursor = 0; S.hayMas = false; S.unseenBelow = 0;
  $('welcome').classList.add('hidden'); $('chat').classList.remove('hidden');
  const c = S.convs.find(x => x.contacto === user) || {};
  paintHeader({ usuario: user, avatar: c.avatar, verificadoNivel: c.verificadoNivel, online: c.online });
  $('msgs').innerHTML = '<div class="chat-empty"><div class="skel" style="width:220px;height:40px"></div></div>';
  $('typing').classList.remove('show');
  setLocked(null);
  renderConvs();
  if (isMobile()) {
    $('app').classList.add('chat-open');
    if (!history.state || history.state.chat !== user) history.pushState({ chat: user }, '', `?usuario=${encodeURIComponent(user)}`);
  }
  try {
    const [info, d] = await Promise.all([api(`/chat/contacto/${encodeURIComponent(user)}`), api(`/chat/mensajes/${encodeURIComponent(user)}`)]);
    if (S.contact !== user) return;
    S.info = info.contacto; paintHeader(S.info); setLocked(S.info);
    S.cursor = d.cursor; S.hayMas = d.hayMas;
    mergeMsgs(d.mensajes, true);
    renderAll(true);
    const cv = S.convs.find(x => x.contacto === user); if (cv) { cv.noLeidos = 0; renderConvs(); }
    startPoll();
    if (!isMobile()) $('inp').focus();
  } catch (e) {
    if (S.contact !== user) return;
    $('msgs').innerHTML = `<div class="chat-empty"><div class="big">${e.status === 404 ? '🫥' : '📡'}</div>${e.status === 404 ? `@${esc(user)} no existe.` : 'No se pudo abrir el chat.'}<br><br><button class="btn" onclick="S.contact=null;openChat('${esc(user)}')">Reintentar</button></div>`;
    setLocked({ existe: false });
  }
}
function closeChat() {
  stopPoll(); S.contact = null; S.info = null;
  $('app').classList.remove('chat-open');
  $('chat').classList.add('hidden'); $('welcome').classList.remove('hidden');
  if (location.search) history.replaceState(null, '', location.pathname);

}
window.addEventListener('popstate', () => { if (S.contact && (!history.state || !history.state.chat)) closeChat(); });
function paintHeader(u) {

}
function paintStatus(typing) {

async function follow() {

/* ── Mensajes: datos ─────────────────────────────────── */
function mergeMsgs(list) {
  let nuevos = 0, cambios = 0;
  for (const m of list || []) {
    const id = String(m.id);
    const prev = S.msgs.get(id);
    if (!prev) { S.msgs.set(id, m); nuevos++; }
    else if (JSON.stringify(prev) !== JSON.stringify(m)) { S.msgs.set(id, m); cambios++; }
  }
  if (nuevos) S.order = [...S.msgs.values()].sort((a, b) => new Date(a.fecha) - new Date(b.fecha)).map(m => String(m.id));
  return { nuevos, cambios };
}
function nearBottom() { const el = $('msgs'); return el.scrollHeight - el.scrollTop - el.clientHeight < 140; }
function scrollBottom(smooth) {
  const el = $('msgs');
  el.scrollTo({ top: el.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  S.unseenBelow = 0; paintToBottom();
}
function paintToBottom() {
  const show = !nearBottom();
  $('to-bottom').classList.toggle('show', show);
  const n = $('tb-n'); n.textContent = S.unseenBelow; n.classList.toggle('hidden', !S.unseenBelow);
}

/* ── Mensajes: render ────────────────────────────────── */
const ITEM_RE = /biblioteca\.html\?id=([a-f\d]{24})/i;
const itemCache = new Map();
function renderAll(toBottom, keepFrom) {
  const box = $('msgs');
  const prevH = box.scrollHeight, prevTop = box.scrollTop;
  const frag = document.createDocumentFragment();
  if (S.hayMas) {
    const b = document.createElement('button');
    b.className = 'load-older'; b.textContent = S.loadingOlder ? 'Cargando…' : 'Ver mensajes anteriores';
    b.onclick = loadOlder; frag.appendChild(b);
  }
  if (!S.order.length) {
    const e = document.createElement('div'); e.className = 'chat-empty';
    e.innerHTML = `<div class="big">👋</div>Saluda a <b>@${esc(S.contact)}</b><br><small style="color:var(--txt3)">Los mensajes se guardan 90 días.</small>`;
    frag.appendChild(e);
  }
  let lastDay = '', prev = null;
  const lastMine = [...S.order].reverse().map(id => S.msgs.get(id)).find(m => m.de === ME);
  S.order.forEach(id => {
    const m = S.msgs.get(id);
    const day = new Date(m.fecha).toDateString();
    if (day !== lastDay) { lastDay = day; prev = null; const d = document.createElement('div'); d.className = 'day'; d.textContent = fmtDia(m.fecha); frag.appendChild(d); }
    const cont = prev && prev.de === m.de && (new Date(m.fecha) - new Date(prev.fecha)) < 5 * 60e3;
    frag.appendChild(rowEl(m, cont, lastMine && lastMine.id === m.id));
    prev = m;
  });
  box.innerHTML = ''; box.appendChild(frag);
  if (toBottom) box.scrollTop = box.scrollHeight;
  else if (keepFrom === 'top') box.scrollTop = box.scrollHeight - prevH + prevTop;
  else box.scrollTop = prevTop;
  hydrateCards();
  if (S.hits.length) searchInChat($('in-q').value, true);
  paintToBottom();
}
function rowEl(m, cont, isLastMine) {
  const mine = m.de === ME;
  const row = document.createElement('div');
  row.className = `row${mine ? ' mine' : ''}${cont ? ' cont' : ' first'}`;
  row.dataset.id = m.id;
  const slot = mine ? '' : `<span class="av-slot">${cont ? '' : avatarHTML(m.de, S.info?.avatar, false, 'xs')}</span>`;
  const time = `${m.editado && !m.borrado ? 'editado · ' : ''}${fmtHora(m.fecha)}`;
  const tick = mine && !m.borrado ? `<ion-icon name="${m.leido ? 'checkmark-done' : 'checkmark'}" class="${m.leido ? 'seen' : ''}"></ion-icon>` : '';
  let inner;
  if (m.borrado) {
    inner = `<div class="bubble deleted"><ion-icon name="ban-outline" style="vertical-align:-2px"></ion-icon> ${mine ? 'Eliminaste este mensaje' : 'Mensaje eliminado'}<span class="meta">${fmtHora(m.fecha)}</span></div>`;
  } else {
    const onlyImg = m.imagen && !m.texto && !m.replyTo;
    const jumbo = !m.imagen && !m.replyTo && m.texto && soloEmoji(m.texto);
    const q = m.replyTo ? `<button class="quote" onclick="jumpTo('${esc(m.replyTo.id)}')"><b>${m.replyTo.de === ME ? 'Tú' : '@' + esc(m.replyTo.de)}</b><span>${m.replyTo.imagen && !m.replyTo.texto ? '📷 Imagen' : esc(m.replyTo.texto)}</span></button>` : '';
    const img = m.imagen ? `<span class="bimg" onclick="openLB('${esc(m.imagen)}')"><img src="${esc(cld(m.imagen, 'c_limit,w_720,q_auto,f_auto'))}" alt="Imagen" loading="lazy"></span>` : '';
    const card = m.texto && ITEM_RE.test(m.texto) ? `<a class="card-link" data-item="${m.texto.match(ITEM_RE)[1]}" href="./biblioteca.html?id=${m.texto.match(ITEM_RE)[1]}"><img alt=""><span><b>Publicación de UpGames</b><small>Toca para abrir</small></span></a>` : '';
    inner = `<div class="bubble${onlyImg ? ' only-img' : ''}${jumbo ? ' jumbo' : ''}">${q}${img}${m.texto ? `<span class="txt">${linkify(m.texto)}</span>` : ''}${card}<span class="meta">${time}${tick}</span></div>`;
  }
  const rx = (m.reacciones || []);
  let reacts = '';
  if (rx.length) {
    const count = {}; rx.forEach(r => { count[r.e] = (count[r.e] || 0) + 1; });
    const mineE = (rx.find(r => r.u === ME) || {}).e;
    reacts = `<button class="reacts" onclick="openMsgMenu('${m.id}')">${Object.keys(count).map(e => `<span class="${e === mineE ? 'me' : ''}">${e}</span>`).join('')}${rx.length > 1 ? `<small>${rx.length}</small>` : ''}</button>`;
  }
  row.innerHTML = `${slot}<div class="bwrap">${inner}${reacts}${m.borrado ? '' : `<button class="more-btn" onclick="openMsgMenu('${m.id}')" aria-label="Opciones del mensaje"><ion-icon name="ellipsis-horizontal"></ion-icon></button>`}</div>`;
  if (!m.borrado) bindPress(row.querySelector('.bubble'), m.id);
  return row;
}
// Mantener pulsado (móvil) o clic derecho / doble clic (PC) → menú del mensaje
function bindPress(el, id) {
  let t = null, moved = false;
  el.addEventListener('touchstart', () => { moved = false; t = setTimeout(() => { if (!moved) { navigator.vibrate && navigator.vibrate(12); openMsgMenu(id); } }, 430); }, { passive: true });
  el.addEventListener('touchmove', () => { moved = true; clearTimeout(t); }, { passive: true });
  el.addEventListener('touchend', () => clearTimeout(t));
  el.addEventListener('contextmenu', e => { e.preventDefault(); openMsgMenu(id); });
  el.addEventListener('dblclick', () => react(id, '❤️'));
}
// Tarjetas de publicaciones de UpGames compartidas en el chat
async function hydrateCards() {
  for (const a of document.querySelectorAll('.card-link[data-item]')) {
    const id = a.dataset.item;
    let it = itemCache.get(id);
    if (it === undefined) {
      itemCache.set(id, null);
      try { const r = await fetch(`${API}/items/${id}`); it = r.ok ? await r.json() : null; } catch (_) { it = null; }
      itemCache.set(id, it);
    }
    if (!it || !it._id) continue;
    const img = it.image && !/\.(mp4|webm|mov|m4v|avi|3gp|3g2|mkv|ogv|mpe?g|wmv|flv)(\?|$)|\/video\/upload\//i.test(it.image) ? cld(it.image, 'c_fill,w_120,h_120,q_auto,f_auto') : '';
    a.innerHTML = `${img ? `<img src="${esc(img)}" alt="">` : '<img alt="">'}<span><b>${esc(it.title)}</b><small>${esc(it.category || 'UpGames')} · por @${esc(it.usuario || '')}</small></span>`;
  }
}
function jumpTo(id) {
  const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  if (!row) { toast('Ese mensaje ya no está cargado'); return; }
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const b = row.querySelector('.bubble'); b.classList.add('hl'); setTimeout(() => b.classList.remove('hl'), 1400);
}
async function loadOlder() {
  if (S.loadingOlder || !S.order.length) return;
  S.loadingOlder = true;
  const first = S.msgs.get(S.order[0]);
  try {
    const d = await api(`/chat/mensajes/${encodeURIComponent(S.contact)}?antes=${new Date(first.fecha).getTime()}`);
    S.hayMas = d.hayMas; mergeMsgs(d.mensajes);
  } catch (_) { toast('No se pudieron cargar más mensajes'); }
  S.loadingOlder = false;
  renderAll(false, 'top');
}
$('msgs').addEventListener('scroll', () => {
  if ($('msgs').scrollTop < 60 && S.hayMas && !S.loadingOlder) loadOlder();
  if (nearBottom()) S.unseenBelow = 0;
  paintToBottom();
}, { passive: true });

/* ── Polling (solo con la pestaña visible) ───────────── */
async function pollMsgs() {
  const user = S.contact;
  if (!user || document.hidden) return;
  try {
    const d = await api(`/chat/mensajes/${encodeURIComponent(user)}?desde=${S.cursor}`);
    if (S.contact !== user) return;
    S.cursor = d.cursor;
    const abajo = nearBottom();
    const recibidos = (d.mensajes || []).filter(m => m.de !== ME && !S.msgs.has(String(m.id)));
    const { nuevos, cambios } = mergeMsgs(d.mensajes);
    if (nuevos || cambios) {
      renderAll(abajo && nuevos > 0);
      if (recibidos.length) {
        if (!abajo) S.unseenBelow += recibidos.length;
        if (!muted.has(user)) ping();
        if (!abajo) paintToBottom();
      }
    }
    $('typing').classList.toggle('show', !!d.escribiendo);
    paintStatus(!!d.escribiendo);
    if (d.escribiendo && abajo) $('msgs').scrollTop = $('msgs').scrollHeight;
  } catch (_) {}
}
async function refreshInfo() {
  if (!S.contact || document.hidden) return;
  try { const i = await api(`/chat/contacto/${encodeURIComponent(S.contact)}`); if (S.info && i.contacto.usuario === S.contact) { S.info = i.contacto; paintStatus($('typing').classList.contains('show')); setLocked(S.info); } } catch (_) {}
}
let infoTick = 0;
function startPoll() { stopPoll(); S.poll = setInterval(() => { pollMsgs(); if (++infoTick % 10 === 0) refreshInfo(); }, 2500); }
function stopPoll() { if (S.poll) clearInterval(S.poll); S.poll = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { pollMsgs(); loadConvs(); } });

/* ── Enviar / editar ─────────────────────────────────── */
function onInput() {
  const el = $('inp');
  el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 132) + 'px';
  $('send').disabled = !el.value.trim() && !S.pendingImg;
  if (el.value.trim() && S.contact && Date.now() - S.typingSent > 3000) {
    S.typingSent = Date.now();
    fetch(`${API}/chat/escribiendo/${encodeURIComponent(S.contact)}`, { method: 'POST', headers: H() }).catch(() => {});
  }
  try { sessionStorage.setItem('ugc_draft_' + S.contact, el.value); } catch (_) {}
}
function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isMobile()) { e.preventDefault(); send(); }
  if (e.key === 'Escape') clearCtx();
  if (e.key === 'ArrowUp' && !$('inp').value) { const lm = [...S.order].reverse().map(id => S.msgs.get(id)).find(m => m.de === ME && !m.borrado && m.texto); if (lm) startEdit(lm.id); }
}
async function send() {
  const el = $('inp');
  const texto = el.value.trim();
  if (!S.contact || (!texto && !S.pendingImg)) return;
  const btn = $('send'); btn.disabled = true;
  // Editar
  if (S.edit) {
    const id = S.edit.id;
    try { const d = await api(`/chat/mensaje/${id}`, { method: 'PATCH', body: JSON.stringify({ texto }) }); mergeMsgs([d.mensaje]); renderAll(false); clearCtx(); el.value = ''; onInput(); }
    catch (e) { toast('❌ ' + e.message); btn.disabled = false; }
    return;
  }
  let imagen = '';
  if (S.pendingImg) {
    try { toast('Subiendo imagen…', 1500); imagen = (await api('/chat/imagen', { method: 'POST', body: JSON.stringify({ imagen: S.pendingImg }) })).url; }
    catch (e) { toast('❌ ' + e.message); btn.disabled = false; return; }
  }
  const replyTo = S.reply ? S.reply.id : undefined;
  const tmpId = 'tmp' + Date.now();
  mergeMsgs([{ id: tmpId, de: ME, para: S.contact, texto, imagen, leido: false, fecha: new Date().toISOString(), replyTo: S.reply ? { id: S.reply.id, de: S.reply.de, texto: S.reply.texto, imagen: !!S.reply.imagen } : null, reacciones: [] }]);
  renderAll(true);
  el.value = ''; clearCtx(); onInput();
  try { sessionStorage.removeItem('ugc_draft_' + S.contact); } catch (_) {}
  try {
    const d = await api('/chat/enviar', { method: 'POST', body: JSON.stringify({ para: S.contact, texto, imagen, replyTo }) });
    S.msgs.delete(tmpId); S.order = S.order.filter(x => x !== tmpId);
    mergeMsgs([d.mensaje]); renderAll(true);
    upsertConvPreview(d.mensaje);
  } catch (e) {
    S.msgs.delete(tmpId); S.order = S.order.filter(x => x !== tmpId); renderAll(false);
    el.value = texto; onInput();
    toast('❌ ' + e.message);
    if (['NO_MUTUO', 'BLOQUEADO', 'YO_BLOQUEO'].includes(e.code)) refreshInfo();
  }
  btn.disabled = !el.value.trim();
}
function upsertConvPreview(m) {
  let c = S.convs.find(x => x.contacto === S.contact);
  if (!c) { c = { contacto: S.contact, avatar: S.info?.avatar, verificadoNivel: S.info?.verificadoNivel, online: S.info?.online, noLeidos: 0 }; S.convs.unshift(c); }
  c.ultimoMensaje = { texto: m.texto, imagen: m.imagen, de: ME, fecha: m.fecha, leido: false };
  renderConvs();
}

/* ── Responder / editar / contexto ───────────────────── */
function startReply(id) {
  const m = S.msgs.get(String(id)); if (!m) return;
  S.edit = null; S.reply = m;
  showCtx(false, m.de === ME ? 'Respondiendo a ti' : `Respondiendo a @${m.de}`, m.texto || '📷 Imagen', m.imagen);

}
function startEdit(id) {
  const m = S.msgs.get(String(id)); if (!m) return;

}
function showCtx(edit, title, txt, img) {

  $('ctx-title').textContent = title; $('ctx-txt').textContent = txt || '';

function clearCtx() {
  const wasEdit = !!S.edit;
  S.reply = null; S.edit = null; S.pendingImg = null;
  $('ctx-bar').classList.remove('show');
  if (wasEdit) { $('inp').value = ''; onInput(); }
  $('send').disabled = !$('inp').value.trim();
}

/* ── Menú de un mensaje ──────────────────────────────── */
function openMsgMenu(id) {
  const m = S.msgs.get(String(id)); if (!m || m.borrado || String(id).startsWith('tmp')) return;
  const mine = m.de === ME;
  const myR = ((m.reacciones || []).find(r => r.u === ME) || {}).e;
  const edad = Date.now() - new Date(m.fecha).getTime();
  const who = (m.reacciones || []).length ? `<div class="sec" style="padding:4px 18px 8px">${m.reacciones.map(r => `${r.e} ${r.u === ME ? 'Tú' : '@' + esc(r.u)}`).join(' · ')}</div>` : '';
  $('menu-body').innerHTML = `
    <div class="react-bar">${REACTS.map(e => `<button class="${e === myR ? 'me' : ''}" onclick="closeOv('ov-menu');react('${m.id}','${e}')">${e}</button>`).join('')}</div>${who}
    <button class="menu-item" onclick="closeOv('ov-menu');startReply('${m.id}')"><ion-icon name="arrow-undo-outline"></ion-icon>Responder</button>
    ${m.texto ? `<button class="menu-item" onclick="closeOv('ov-menu');copiar('${m.id}')"><ion-icon name="copy-outline"></ion-icon>Copiar texto</button>` : ''}
    ${m.imagen ? `<button class="menu-item" onclick="closeOv('ov-menu');openLB('${esc(m.imagen)}')"><ion-icon name="expand-outline"></ion-icon>Ver imagen</button>` : ''}
    ${mine && m.texto && edad < 15 * 60e3 ? `<button class="menu-item" onclick="closeOv('ov-menu');startEdit('${m.id}')"><ion-icon name="create-outline"></ion-icon>Editar</button>` : ''}
    <button class="menu-item danger" onclick="closeOv('ov-menu');borrar('${m.id}','mi')"><ion-icon name="trash-outline"></ion-icon>Eliminar para mí</button>
    ${mine && edad < 864e5 ? `<button class="menu-item danger" onclick="closeOv('ov-menu');borrar('${m.id}','todos')"><ion-icon name="trash-bin-outline"></ion-icon>Eliminar para todos</button>` : ''}`;
  openOv('ov-menu');
}
async function react(id, e) {
  const m = S.msgs.get(String(id)); if (!m || m.borrado || String(id).startsWith('tmp')) return;
  try { const d = await api(`/chat/mensaje/${id}/reaccion`, { method: 'POST', body: JSON.stringify({ emoji: e }) }); mergeMsgs([d.mensaje]); renderAll(false); }
  catch (err) { toast('❌ ' + err.message); }
}
async function copiar(id) {
  const m = S.msgs.get(String(id));
  try { await navigator.clipboard.writeText(m.texto); toast('Texto copiado'); } catch (_) { toast('No se pudo copiar'); }
}
function borrar(id, modo) {
  confirmar('🗑️', modo === 'todos' ? '¿Eliminar para todos?' : '¿Eliminar para ti?',
    modo === 'todos' ? 'El mensaje desaparecerá también para la otra persona.' : 'Solo se borrará en tu chat; la otra persona lo seguirá viendo.',
    'Eliminar', async () => {
      try {
        const d = await api(`/chat/mensaje/${id}?modo=${modo}`, { method: 'DELETE' });
        if (modo === 'todos' && d.mensaje) mergeMsgs([d.mensaje]);
        else { S.msgs.delete(String(id)); S.order = S.order.filter(x => x !== String(id)); }
        renderAll(false);
      } catch (e) { toast('❌ ' + e.message); }
    }, true);
}

/* ── Menú del chat ───────────────────────────────────── */
function openChatMenu() {
  const u = S.contact; if (!u) return;
  const i = S.info || {};
  $('menu-body').innerHTML = `
    <h3 style="padding:0 18px 6px">@${esc(u)}</h3>
    <button class="menu-item" onclick="closeOv('ov-menu');goProfile()"><ion-icon name="person-circle-outline"></ion-icon>Ver perfil</button>
    <button class="menu-item" onclick="closeOv('ov-menu');togglePin()"><ion-icon name="${pinned.has(u) ? 'pin' : 'pin-outline'}"></ion-icon>${pinned.has(u) ? 'Desfijar chat' : 'Fijar chat'}</button>
    <button class="menu-item" onclick="closeOv('ov-menu');toggleMute()"><ion-icon name="${muted.has(u) ? 'notifications-outline' : 'notifications-off-outline'}"></ion-icon>${muted.has(u) ? 'Activar notificaciones' : 'Silenciar'}</button>
    <button class="menu-item" onclick="closeOv('ov-menu');toggleInSearch(true)"><ion-icon name="search-outline"></ion-icon>Buscar en el chat</button>
    <button class="menu-item danger" onclick="closeOv('ov-menu');vaciar()"><ion-icon name="trash-outline"></ion-icon>Vaciar chat</button>
    <button class="menu-item danger" onclick="closeOv('ov-menu');toggleBlock(${!i.yoBloqueo})"><ion-icon name="ban-outline"></ion-icon>${i.yoBloqueo ? 'Desbloquear' : 'Bloquear'} a @${esc(u)}</button>`;
  openOv('ov-menu');
}
function togglePin() { const u = S.contact; pinned.has(u) ? pinned.delete(u) : pinned.add(u); LS.set('ugc_pinned', [...pinned]); renderConvs(); toast(pinned.has(u) ? '📌 Chat fijado' : 'Chat desfijado'); }
function toggleMute() { const u = S.contact; muted.has(u) ? muted.delete(u) : muted.add(u); LS.set('ugc_muted', [...muted]); renderConvs(); toast(muted.has(u) ? '🔕 Chat silenciado' : '🔔 Notificaciones activadas'); }
function vaciar() {
  const u = S.contact;
  confirmar('🧹', 'Vaciar chat', `Se borrarán los mensajes con <b>@${esc(u)}</b> solo para ti. @${esc(u)} los seguirá viendo.`, 'Vaciar', async () => {
    try { await api(`/chat/conversacion/${encodeURIComponent(u)}`, { method: 'DELETE' }); S.msgs.clear(); S.order = []; S.hayMas = false; renderAll(true); S.convs = S.convs.filter(c => c.contacto !== u); renderConvs(); toast('Chat vaciado'); }
    catch (e) { toast('❌ ' + e.message); }
  }, true);
}
function toggleBlock(bloquear) {
  const u = S.contact;
  const run = async () => {
    try {
      await api(`/chat/bloqueo/${encodeURIComponent(u)}`, { method: bloquear ? 'POST' : 'DELETE' });
      toast(bloquear ? `@${u} bloqueado` : `@${u} desbloqueado`);
      S.contactos = null; await refreshInfo(); loadConvs();
    } catch (e) { toast('❌ ' + e.message); }
  };
  if (!bloquear) return run();
  confirmar('🚫', `¿Bloquear a @${esc(u)}?`, 'No podrá escribirte ni ver cuándo estás en línea. Puedes desbloquearlo cuando quieras.', 'Bloquear', run, true);
}

/* ── Buscar dentro del chat ──────────────────────────── */
function toggleInSearch(show) {
  const bar = $('in-search');
  const on = show === undefined ? !bar.classList.contains('show') : show;
  bar.classList.toggle('show', on);
  if (on) setTimeout(() => $('in-q').focus(), 50);
  else { $('in-q').value = ''; S.hits = []; S.hitIdx = -1; $('in-n').textContent = ''; document.querySelectorAll('.bubble .txt mark').forEach(mk => mk.replaceWith(mk.textContent)); }
}
function searchInChat(q, keep) {
  q = (q || '').trim().toLowerCase();
  document.querySelectorAll('.bubble .txt').forEach(t => { const m = S.msgs.get(t.closest('.row').dataset.id); if (m) t.innerHTML = linkify(m.texto); });
  S.hits = [];
  if (q.length < 2) { $('in-n').textContent = ''; return; }
  document.querySelectorAll('.row').forEach(r => {
    const m = S.msgs.get(r.dataset.id);
    if (m && m.texto && m.texto.toLowerCase().includes(q)) {
      S.hits.push(r.dataset.id);
      const t = r.querySelector('.txt');
      const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      if (t) t.innerHTML = esc(m.texto).replace(re, s => `<mark>${s}</mark>`);
    }
  });
  if (!keep) S.hitIdx = S.hits.length - 1;
  $('in-n').textContent = S.hits.length ? `${S.hitIdx + 1}/${S.hits.length}` : '0';
  if (!keep && S.hits.length) jumpTo(S.hits[S.hitIdx]);
}
function nextHit(dir = -1) {
  if (!S.hits.length) return;
  S.hitIdx = (S.hitIdx + dir + S.hits.length) % S.hits.length;
  $('in-n').textContent = `${S.hitIdx + 1}/${S.hits.length}`;
  jumpTo(S.hits[S.hitIdx]);
}

/* ── Imágenes: elegir, pegar, arrastrar (se comprimen) ─ */
$('file').addEventListener('change', function () { if (this.files[0]) pickImage(this.files[0]); this.value = ''; });
function onPaste(e) { const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/')); if (f) { e.preventDefault(); pickImage(f); } }
['dragenter', 'dragover'].forEach(ev => $('main').addEventListener(ev, e => { if (S.contact && [...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); $('drop-hint').classList.add('show'); } }));
['dragleave', 'drop'].forEach(ev => $('main').addEventListener(ev, e => { $('drop-hint').classList.remove('show'); if (ev === 'drop') { e.preventDefault(); const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/')); if (f) pickImage(f); } }));
async function pickImage(file) {
  if (!S.contact || $('locked').classList.contains('show')) return;   // chat bloqueado / sin permiso
  if (file.size > 25 * 1024 * 1024) { toast('❌ Imagen demasiado grande (máx 25 MB)'); return; }
  try {
    S.pendingImg = await comprimir(file, 1600, .85);
    S.reply = null; S.edit = null;
    showCtx(false, 'Imagen lista para enviar', 'Añade un mensaje si quieres', S.pendingImg);
    $('ctx-img').src = S.pendingImg;
    $('send').disabled = false; $('inp').focus();
  } catch (_) { toast('❌ No se pudo leer la imagen'); }
}
function comprimir(file, max, q) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}
function openLB(url) { $('lb-img').src = cld(url, 'c_limit,w_1600,q_auto,f_auto'); $('lb-dl').href = url; $('lb').classList.add('show'); }
function closeLB() { $('lb').classList.remove('show'); }

/* ── Emojis ──────────────────────────────────────────── */
const EMOJIS = {
  '😀': '😀 😃 😄 😁 😆 😅 🤣 😂 🙂 😉 😊 😇 🥰 😍 🤩 😘 😋 😛 😜 🤪 😎 🤓 🥳 😏 😒 🙄 😬 😌 😔 😴 😷 🤒 🥵 🥶 😵 🤯 😕 😟 😮 😲 🥺 😢 😭 😤 😠 😡 🤬 😈 💀 🤡 👻 👽 🤖',
  '👍': '👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 👋 🤚 ✋ 👏 🙌 🙏 💪 🫶 🤝 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 💔 💕 💖 💯 💢 💥 💫 💬',
  '🎮': '🎮 🕹️ 👾 🎯 🎲 🏆 🥇 🥈 🥉 🏅 🎖️ ⚔️ 🛡️ 🗡️ 🏹 🔫 💣 🧩 ♟️ 🃏 🎰 🚀 🛸 🏎️ ⚽ 🏀 🎳 🥊 🛹 🎧 🎤 🎬 📸 💻 🖥️ ⌨️ 🖱️ 📱 💾 💿',
  '🔥': '🔥 ✨ ⭐ 🌟 ⚡ 🌈 ☀️ 🌙 ❄️ 🌊 🎉 🎊 🎁 🎂 🍕 🍔 🍟 🌮 🍜 🍣 🍩 🍪 ☕ 🧃 🍺 🥂 🐶 🐱 🦊 🐼 🐸 🦄 🐉 🦋 🌸 🍀 🌵',
};
function buildEmoji() {
  const tabs = $('e-tabs');
  Object.keys(EMOJIS).forEach((k, i) => {
    const b = document.createElement('button'); b.className = 'e-tab' + (i ? '' : ' on'); b.textContent = k;
    b.onclick = () => { tabs.querySelectorAll('.e-tab').forEach(x => x.classList.remove('on')); b.classList.add('on'); fillEmoji(k); };
    tabs.appendChild(b);
  });
  fillEmoji(Object.keys(EMOJIS)[0]);
}
function fillEmoji(k) { $('e-grid').innerHTML = EMOJIS[k].split(' ').map(e => `<button onclick="insertEmoji('${e}')">${e}</button>`).join(''); }
function insertEmoji(e) { const el = $('inp'); const s = el.selectionStart ?? el.value.length; el.value = el.value.slice(0, s) + e + el.value.slice(el.selectionEnd ?? s); el.selectionStart = el.selectionEnd = s + e.length; onInput(); el.focus(); }
function toggleEmoji() { $('emoji').classList.toggle('show'); }
function closeEmoji() { $('emoji').classList.remove('show'); }
document.addEventListener('click', e => { if (!e.target.closest('#emoji') && !e.target.closest('[aria-label="Emojis"]')) closeEmoji(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeEmoji(); ['ov-menu', 'ov-new', 'ov-modal'].forEach(closeOv); closeLB(); } });

/* ── Notificaciones del sistema (si el usuario las permite) ─ */
function notificar(c) {
  if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const u = c.ultimoMensaje || {};
    new Notification(`@${c.contacto}`, { body: u.imagen && !u.texto ? '📷 Imagen' : (u.texto || '').slice(0, 90), tag: 'ugc-' + c.contacto, icon: c.avatar || undefined });
  } catch (_) {}
}

/* ══════════════════════════════════════════════════════════════════
   INICIO
   ══════════════════════════════════════════════════════════════════ */
async function init() {
  paintSound(); buildEmoji();
  await loadConvs();
  S.listPoll = setInterval(() => { if (!document.hidden) loadConvs(); }, 9000);
  const u = new URLSearchParams(location.search).get('usuario');
  if (u) { history.replaceState(isMobile() ? null : history.state, '', location.pathname); openChat(u); }
  // Pedir permiso de notificaciones tras la primera interacción (no al cargar)
  document.addEventListener('click', function pedir() {
    document.removeEventListener('click', pedir);
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  });
  // Restaurar borrador al abrir un chat
  const _open = openChat;
  window.openChat = async (user) => { await _open(user); try { const d = sessionStorage.getItem('ugc_draft_' + S.contact); if (d && !$('inp').value) { $('inp').value = d; onInput(); } } catch (_) {} };
}
document.addEventListener('DOMContentLoaded', init);
</script>
