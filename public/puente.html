<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpGames | Redirección Segura</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        :root { --neon-green: #39FF14; --dark-bg: #0a0a0a; --card-bg: #1a1a1a; }
        body { background-color: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        .container { box-sizing: border-box; background: var(--card-bg); padding: 30px; border-radius: 20px; border: 1px solid rgba(57, 255, 20, 0.2); box-shadow: 0 0 20px rgba(0,0,0,0.5); width: min(450px, calc(100% - 24px)); text-align: center; margin: 12px 0; }
        .container iframe, .container img, .container video { max-width: 100%; }
        @media (max-width: 420px) { .container { padding: 22px 14px; } h1 { font-size: 1.2rem; } .ad-pass { padding: 13px; } .ad-pass-price { font-size: 1.15rem; } }
        h1 { color: var(--neon-green); font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #aaa; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px; }
        .ad-space { background: #000; border: 1px dashed var(--neon-green); padding: 40px 10px; margin: 20px 0; border-radius: 10px; color: #555; }
        #timer { font-size: 1.2rem; font-weight: bold; color: var(--neon-green); margin: 20px 0; }
        .btn-neon { background: var(--neon-green); color: #000; padding: 15px 40px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; box-shadow: 0 0 15px rgba(57, 255, 20, 0.4); display: none; margin: 0 auto; }
        .btn-neon:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--neon-green); }
        .btn-neon:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer-note { font-size: 0.7rem; color: #444; margin-top: 30px; }

        /* ── VIDEO DEL JUEGO ── */
        #game-media-wrap {
            width: 100%; margin: 12px 0;
            border-radius: 12px; overflow: hidden;
            background: #000; display: none;
            position: relative; aspect-ratio: 16/9;
        }
        #game-media-wrap iframe,
        #game-media-wrap video {
            width: 100%; height: 100%; border: none; display: block;
        }
        #game-title-bar {
            font-size: .8rem; color: #888; margin: 4px 0 12px;
            text-align: center; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .error-box { background: rgba(255, 67, 67, 0.1); border: 1px solid #ff4343; padding: 15px; border-radius: 10px; color: #ff4343; margin: 15px 0; }
        .success-box { background: rgba(57, 255, 20, 0.1); border: 1px solid var(--neon-green); padding: 15px; border-radius: 10px; color: var(--neon-green); margin: 15px 0; }
.serie-box { margin: 18px 0 6px; padding: 14px; border-radius: 14px; background: linear-gradient(135deg, rgba(90,200,250,.12), rgba(57,255,20,.06)); border: 1px solid rgba(90,200,250,.35); text-align: left; }
        .serie-h { font-size: .95rem; color: #fff; } .serie-sub { font-size: .78rem; color: #8fdcff; margin-top: 3px; }
        .serie-bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,.08); margin: 10px 0; overflow: hidden; }
        .serie-bar i { display: block; height: 100%; background: linear-gradient(90deg, #39FF14, #5AC8FA); }
        .serie-next { display: block; text-align: center; background: #5AC8FA; color: #001018; font-weight: 800; padding: 12px; border-radius: 12px; text-decoration: none; }
        .serie-hint { font-size: .72rem; color: #777; margin-top: 8px; text-align: center; }
        .serie-done { font-size: .85rem; color: #39FF14; text-align: center; }
        /* ── ACCESO DIRECTO (US$1 / 100 monedas) ── */
        .ad-pass { margin: 16px 0 6px; padding: 16px; border-radius: 16px; text-align: left; background: linear-gradient(135deg, rgba(255,204,77,.14), rgba(57,255,20,.07)); border: 1.5px solid rgba(255,204,77,.55); box-shadow: 0 10px 30px -14px rgba(255,204,77,.55); }
        .ad-pass-h { display: flex; align-items: center; gap: 12px; }
        .ad-pass-ic { width: 44px; height: 44px; border-radius: 12px; background: #ffcc4d; color: #241a00; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .ad-pass-h b { display: block; font-size: 1rem; color: #fff; }
        .ad-pass-h small { display: block; font-size: .78rem; color: #c9c9c9; margin-top: 2px; line-height: 1.35; }
        .ad-pass-price { margin-left: auto; font-size: 1.35rem; font-weight: 800; color: #ffcc4d; white-space: nowrap; }
        .ad-pass-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .ad-pass-btn { width: 100%; padding: 13px; border-radius: 12px; border: 0; font-weight: 800; font-size: .92rem; cursor: pointer; font-family: inherit; transition: transform .12s, filter .15s; }
        .ad-pass-btn:active { transform: scale(.98); }
        .ad-pass-btn.card { background: #ffcc4d; color: #241a00; }
        .ad-pass-btn.coins { background: rgba(255,255,255,.07); color: #fff; border: 1px solid rgba(255,255,255,.18); }
        .ad-pass-btn:disabled { opacity: .55; cursor: wait; }
        .ad-pass-note { font-size: .7rem; color: #8a8a8a; margin-top: 8px; text-align: center; }
        .ad-pass-note a { color: #39FF14; }
        .ad-pass.done { border-color: var(--neon-green); background: rgba(57,255,20,.08); box-shadow: none; }
        .debug-info { background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 5px; font-size: 0.7rem; color: #666; margin-top: 15px; text-align: left; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    
    <div class="container">
        <ion-icon name="shield-checkmark-outline" style="font-size: 48px; color: var(--neon-green);"></ion-icon>
        <h1>Saliendo de UpGames</h1>
        <p>Estás siendo redirigido a un servidor externo. Recuerda que UpGames es un directorio neutral y no almacena archivos.</p>

        <!-- ⭐ MEDIA DEL JUEGO — se carga dinámicamente desde los parámetros de URL -->
        <div id="game-title-bar"></div>
        <div id="game-media-wrap">
            <!-- Se rellena con JS -->
        </div>
        
        <!-- ⚡ ACCESO DIRECTO: pagar para saltarse la espera y los anuncios -->
        <div id="ad-pass" class="ad-pass" style="display:none"></div>

        <!-- ⭐ PUBLICIDAD 1 -->
        <script>
            atOptions = {
                'key': '0af19e39530f3a17d0722c5f0c91735a',
                'format': 'iframe',
                'height': 250,
                'width': 300,
                'params': {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/0af19e39530f3a17d0722c5f0c91735a/invoke.js"></script><br /><br />

        <div id="timer">Preparando enlace en 30...</div>
        <div id="error-msg" class="error-box" style="display:none;"></div>
        <div id="success-msg" class="success-box" style="display:none;"></div>
        <button id="btn" class="btn-neon">Obtener Enlace</button><br />
        
        <!-- ⭐ PUBLICIDAD 2 -->
        <script async="async" data-cfasync="false" src="https://pl28635483.effectivegatecpm.com/d0ede3882435cb5a80915e26542fd8db/invoke.js"></script>
        <div id="container-d0ede3882435cb5a80915e26542fd8db"></div><br />

        <script>
          atOptions = {
            'key' : '247173c86298a1f5a8e01a0e1c5889cd',
            'format' : 'iframe',
            'height' : 600,
            'width' : 160,
            'params' : {}
          };
        </script>
        <script src="https://www.highperformanceformat.com/247173c86298a1f5a8e01a0e1c5889cd/invoke.js"></script>

        <div class="footer-note">
            La responsabilidad legal recae en el usuario que indexó el link.
        </div>
        
        <!-- DEBUG INFO (solo visible en desarrollo) -->
        <div id="debug-info" class="debug-info" style="display:none;"></div>
    </div>

    <script src="./upgames-pagos.js" defer></script>
    <script>
        // ⭐ CONFIGURACIÓN
        const API_URL   = "https://upgames-production.up.railway.app";
        const DEBUG_MODE = false; // Cambiar a true para ver logs detallados

        // ── Notifica la descarga al backend de UpGames ──────────────
        function notificarDescarga(itemId, itemData) {
            const usuario = localStorage.getItem('user_admin');

            // Avisa al autor; en el servidor Nexus también aprende tus gustos de esta descarga
            try {
                const autorItem = itemData?.usuario;
                if (usuario && autorItem && autorItem !== usuario) {
                    fetch(`${API_URL}/notificaciones`, {
                        method: 'POST',
                        // Requiere sesión: antes se enviaba sin token y el servidor lo rechazaba siempre
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token') || ''}` },
                        body: JSON.stringify({ itemId })
                    }).catch(() => {});
                }
            } catch(_) {}
        }
        
        // ⭐ ELEMENTOS DOM
        const timerEl = document.getElementById('timer');
        const btnEl = document.getElementById('btn');
        const errorEl = document.getElementById('error-msg');
        const successEl = document.getElementById('success-msg');
        const debugEl = document.getElementById('debug-info');
        
        // ⭐ ESTADO
        let countdown = 30;
        let enlaceFinal = null;
        let validacionRealizada = false;
        let tieneAdBlocker = false; // Se detecta al cargar

        // ⭐ DETECCIÓN DE AD BLOCKER
        // Crea un elemento "cebo" con clases típicas de anuncios.
        // Los bloqueadores los ocultan o eliminan → los detectamos.
        async function detectarAdBlocker() {
            return new Promise(resolve => {
                const bait = document.createElement('div');
                bait.className = 'ad-banner ad-unit ads adsbox ad-placeholder adsbygoogle pub_300x250';
                bait.style.cssText = 'width:1px;height:1px;position:absolute;top:-9999px;left:-9999px;pointer-events:none;';
                bait.setAttribute('aria-hidden', 'true');
                document.body.appendChild(bait);

                // Dar tiempo al bloqueador para actuar (~150ms es suficiente)
                setTimeout(() => {
                    const style = window.getComputedStyle(bait);
                    const bloqueado =
                        bait.offsetHeight === 0 ||
                        bait.offsetWidth  === 0 ||
                        style.display     === 'none' ||
                        style.visibility  === 'hidden' ||
                        style.opacity     === '0' ||
                        !document.body.contains(bait); // algunos lo eliminan del DOM

                    try { document.body.removeChild(bait); } catch (_) {}
                    resolve(bloqueado);
                }, 200);
            });
        }

        // Lanzar detección al cargar (sin bloquear el countdown)
        detectarAdBlocker().then(resultado => {
            tieneAdBlocker = resultado;
            if (resultado) {
                log("⚠️ Ad Blocker detectado — la descarga NO contará para el autor", 'error');
            } else {
                log("✅ Sin Ad Blocker detectado", 'success');
            }
        });
        
        // ⭐ OBTENER PARÁMETROS DE URL
        const urlParams = new URLSearchParams(window.location.search);
        const juegoId = urlParams.get('id');
        const destino = urlParams.get('dest'); // Fallback para formato antiguo
        const mediaParam = urlParams.get('media') ? decodeURIComponent(urlParams.get('media')) : '';
        const titleParam = urlParams.get('title') ? decodeURIComponent(urlParams.get('title')) : '';

        // ⭐ CARGAR MEDIA DEL JUEGO (video o imagen)
        (function loadGameMedia() {
            if (!mediaParam) return;

            const wrap     = document.getElementById('game-media-wrap');
            const titleBar = document.getElementById('game-title-bar');

            if (titleParam) titleBar.textContent = titleParam;

            const isYT  = /youtu\.be\/|youtube\.com\/(watch|embed)/i.test(mediaParam);
            const isMp4 = /\.(mp4|webm|mov)(\?.*)?$/i.test(mediaParam);

            if (isYT) {
                // Extraer ID de YouTube
                let ytId = '';
                const m1 = mediaParam.match(/youtu\.be\/([^?&]+)/);
                const m2 = mediaParam.match(/[?&]v=([^?&]+)/);
                const m3 = mediaParam.match(/\/embed\/([^?&]+)/);
                ytId = (m1||m2||m3||[])[1] || '';
                if (ytId) {
                    wrap.innerHTML = `<iframe
                        src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&loop=1&playlist=${ytId}&controls=1&rel=0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen></iframe>`;
                    wrap.style.display = 'block';
                }
            } else if (isMp4) {
                wrap.innerHTML = `<video src="${mediaParam}" autoplay muted loop playsinline controls></video>`;
                wrap.style.display = 'block';
            } else if (mediaParam.startsWith('http')) {
                // Imagen
                wrap.style.aspectRatio = 'auto';
                wrap.innerHTML = `<img src="${mediaParam}" alt="${titleParam}"
                    style="width:100%;border-radius:12px;display:block;max-height:200px;object-fit:cover;"
                    onerror="document.getElementById('game-media-wrap').style.display='none'">`;
                wrap.style.display = 'block';
            }
        })();
        
        // ⭐ FUNCIÓN DE DEBUG
        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const emoji = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
            const logMsg = `[${timestamp}] ${emoji} ${msg}`;
            
            console.log(logMsg);
            
            if (DEBUG_MODE) {
                debugEl.style.display = 'block';
                debugEl.innerHTML += `<div>${logMsg}</div>`;
                debugEl.scrollTop = debugEl.scrollHeight;
            }
        }

        // ⭐ VALIDACIÓN INICIAL
        log(`Iniciando puente.html - ID: ${juegoId || 'N/A'}`);
        
        if (!juegoId && !destino) {
            showError("❌ Error crítico: No se proporcionó ID del juego ni enlace de destino");
            log("Sin ID ni destino", 'error');
        } else {
            log(`Parámetros recibidos OK - ID: ${juegoId}`);
        }

        // ⭐ COUNTDOWN TIMER
        const interval = setInterval(() => {
            countdown--;
            timerEl.innerText = `Preparando enlace en ${countdown}...`;
            
            if (countdown <= 0) {
                clearInterval(interval);
                timerEl.style.display = 'none';
                btnEl.style.display = 'block';
                // Ya esperó: el acceso directo deja de tener sentido para esta visita
                const pase = document.getElementById('ad-pass');
                if (pase && !pase.classList.contains('done')) pase.style.display = 'none';
                
                log("Timer completado, iniciando validación");
                
                // ⭐ VALIDAR DESCARGA EN EL BACKEND
                if (juegoId) {
                    validarDescarga(juegoId);
                } else if (destino) {
                    // Modo legacy (sin economía)
                    log("Modo legacy activado");
                    enlaceFinal = decodeURIComponent(destino);
                    habilitarBoton();
                }
            }
        }, 1000);

        // ⭐ FUNCIÓN PRINCIPAL: VALIDAR DESCARGA
        async function validarDescarga(juegoId) {
            if (validacionRealizada) {
                log("Validación ya realizada, ignorando");
                return;
            }
            
            validacionRealizada = true;
            btnEl.disabled = true;
            btnEl.innerText = "⏳ Validando descarga...";
            
            log(`Enviando petición al backend - Juego ID: ${juegoId}`);
            
            try {
                const requestBody = { juegoId, tieneAdBlocker };
                log(`Body de la petición: ${JSON.stringify(requestBody)}`);
                
                // ⭐ AVISO VISUAL si hay ad blocker (no bloquea, solo informa)
                if (tieneAdBlocker) {
                    showWarning("⚠️ Bloqueador de anuncios detectado. El autor no recibirá comisión por esta descarga.");
                }
                
                const response = await fetch(`${API_URL}/economia/validar-descarga`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                log(`Respuesta recibida - Status: ${response.status}`);

                // ⭐ MANEJAR ERRORES HTTP
                if (!response.ok) {
                    const errorText = await response.text();
                    log(`Error HTTP ${response.status}: ${errorText}`, 'error');
                    throw new Error(`Error HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                log(`Datos recibidos: ${JSON.stringify(data)}`, 'success');

                if (data.success) {
                    // ⭐ CRÍTICO: Asignar el enlace primero
                    enlaceFinal = data.link;

                    // Guardar metadata del item para notificar al autor al hacer clic
                    window._itemData = {
                        title:    data.title    || data.juego?.title    || '',
                        category: data.category || data.juego?.category || '',
                        tags:     data.tags     || data.juego?.tags     || [],
                        usuario:  data.usuario  || data.juego?.usuario  || '',
                        image:    data.image    || data.juego?.image    || ''
                    };

                    // ⭐ VALIDAR que el enlace existe Y es una URL válida
                    if (!enlaceFinal || enlaceFinal.trim() === '') {
                        log(`⚠️ Backend no devolvió enlace. Data completa: ${JSON.stringify(data)}`, 'error');
                        showError("❌ Error: El backend no devolvió un enlace de descarga válido");
                        btnEl.disabled = true;
                        btnEl.innerText = "Error - Sin enlace";
                        return;
                    }
                    
                    log(`✅ Enlace recibido: ${enlaceFinal.substring(0, 50)}...`, 'success');
                    
                    // ⭐ MOSTRAR MENSAJE SEGÚN EL ESTADO
                    if (data.adBlockerDetectado) {
                        showWarning("⚠️ Acceso permitido, pero tu bloqueador de anuncios impide que el autor reciba comisión. Considera desactivarlo.");
                        log("Ad Blocker confirmado — descarga no contada para el autor", 'info');
                    } else if (data.limiteAlcanzado) {
                        showWarning("⚠️ " + (data.mensaje || "Ya descargaste este juego 2 veces hoy. Aún puedes acceder al enlace."));
                        log("Límite alcanzado pero enlace permitido", 'info');
                    } else {
                        showSuccess(`✅ Descarga validada (${data.descargasEfectivas || 'N/A'} descargas efectivas)`);
                        log(`Descarga contada - Total: ${data.descargasEfectivas}`, 'success');
                    }
                    
                    // ⭐ SIEMPRE HABILITAR EL BOTÓN si tenemos enlace
                    habilitarBoton();
                    mostrarSiguienteParte(juegoId);
                    
                } else {
                    const errorMsg = data.error || data.mensaje || "Error desconocido al validar descarga";
                    log(`Error en respuesta: ${errorMsg}`, 'error');
                    showError("❌ " + errorMsg);
                    btnEl.disabled = true;
                    btnEl.innerText = "Error en validación";
                }
                
            } catch (error) {
                log(`Error crítico: ${error.message}`, 'error');
                console.error("❌ Error completo:", error);
                
                let errorMessage = "Error de conexión con el servidor";
                
                if (error.message.includes("Failed to fetch")) {
                    errorMessage = "No se pudo conectar al servidor. Verifica tu conexión a internet.";
                } else if (error.message.includes("NetworkError")) {
                    errorMessage = "Error de red. El servidor puede estar caído.";
                } else if (error.message.includes("HTTP 4")) {
                    errorMessage = "Petición inválida. Verifica el ID del juego.";
                } else if (error.message.includes("HTTP 5")) {
                    errorMessage = "Error del servidor. Intenta de nuevo en unos minutos.";
                }
                
                showError(`❌ ${errorMessage}`);
                btnEl.disabled = true;
                btnEl.innerText = "Validación fallida";
            }
        }

        // ⭐ HABILITAR BOTÓN DE DESCARGA
        function habilitarBoton() {
            btnEl.disabled = false;
            btnEl.innerText = "🚀 Obtener Enlace";
            btnEl.style.display = 'block';
            
            log("Botón habilitado", 'success');
            
            btnEl.onclick = () => {
                if (enlaceFinal) {
                    log(`Abriendo enlace: ${enlaceFinal}`);

                    // Registrar la descarga real (fire & forget)
                    notificarDescarga(juegoId, window._itemData || {});

                    // Abrir en nueva pestaña
                    const nuevaVentana = window.open(enlaceFinal, '_blank');
                    
                    if (nuevaVentana) {
                        timerEl.style.display = 'block';
                        timerEl.innerText = "✅ Enlace abierto en nueva pestaña";
                        timerEl.style.color = "var(--neon-green)";
                        btnEl.innerText = "🔄 Volver a abrir";
                        log("Enlace abierto correctamente", 'success');
                    } else {
                        showError("⚠️ El navegador bloqueó la ventana emergente. Permite ventanas emergentes para este sitio.");
                        log("Popup bloqueado", 'error');
                    }
                } else {
                    showError("❌ Error: Enlace no disponible");
                    log("Intento de click sin enlace", 'error');
                }
            };
        }

        // ⭐ SERIES POR PARTES: marca esta parte como descargada y ofrece la siguiente.
        // Cada parte es su propia publicación, así que cada una suma descargas al autor.
        async function mostrarSiguienteParte(id) {
            try {
                const lista = JSON.parse(localStorage.getItem('ug_descargadas') || '[]');
                if (!lista.includes(id)) { lista.push(id); localStorage.setItem('ug_descargadas', JSON.stringify(lista.slice(-3000))); }
            } catch (_) {}
            try {
                const r = await fetch(`${API_URL}/items/${encodeURIComponent(id)}/serie`);
                const d = r.ok ? await r.json() : null;
                const serie = d && d.serie; if (!serie) return;
                const i = serie.partes.findIndex(p => p._id === id);
                if (i < 0) return;
                const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
                const actual = serie.partes[i], sig = serie.partes[i + 1];
                const nAct = (actual.serie && actual.serie.parte) || i + 1;
                const box = document.createElement('div');
                box.className = 'serie-box';
                let html = `<div class="serie-h">📁 <b>${esc(serie.base)}</b></div><div class="serie-sub">Parte ${nAct} de ${serie.partes.length}</div>`
                    + `<div class="serie-bar"><i style="width:${Math.round((i + 1) / serie.partes.length * 100)}%"></i></div>`;
                if (sig) {
                    const nSig = (sig.serie && sig.serie.parte) || i + 2;
                    const media = encodeURIComponent((sig.image || '').trim());
                    html += `<a class="serie-next" href="puente.html?id=${encodeURIComponent(sig._id)}&media=${media}&title=${encodeURIComponent(sig.title || '')}">Siguiente: Parte ${nSig} →</a>`
                        + `<div class="serie-hint">Abre primero el enlace de esta parte; luego continúa con la siguiente.</div>`;
                } else {
                    html += `<div class="serie-done">✅ ¡Era la última parte! Ya tienes las ${serie.partes.length}.</div>`;
                }
                box.innerHTML = html;
                const ref = document.querySelector('.footer-note');
                ref.parentNode.insertBefore(box, ref);
            } catch (_) {}
        }

        // ⭐ FUNCIONES DE UI
        function showError(msg) {
            errorEl.innerText = msg;
            errorEl.style.display = 'block';
            successEl.style.display = 'none';
        }

        function showSuccess(msg) {
            successEl.innerText = msg;
            successEl.style.display = 'block';

        }

        function showWarning(msg) {
            timerEl.innerText = msg;
            timerEl.style.color = "#ffcc00";
            timerEl.style.display = 'block';
        }
        
        // ⚡ ACCESO DIRECTO — US$1 (tarjeta/PayPal) o 100 monedas: sin espera ni anuncios.
        // Se paga una vez por publicación; el creador recibe una parte.
        (function accesoDirecto() {
            const box = document.getElementById('ad-pass');
            if (!juegoId || !box) return;
            const token = localStorage.getItem('token') || '';
            const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const cabecera = (extra = '') => `<div class="ad-pass-h"><div class="ad-pass-ic">⚡</div><div><b>Acceso directo</b><small>Sin esperar ${countdown > 0 ? countdown + ' s' : ''} ni anuncios: el enlace se abre al instante.${extra}</small></div><div class="ad-pass-price">US$1</div></div>`;
            const nota = `<div class="ad-pass-note">Pago único por esta publicación: queda desbloqueada en tu cuenta. El creador recibe una parte. <a href="./terminos_condiciones.html#pagos" target="_blank">Términos</a></div>`;
            box.style.display = 'block';

            function listo(link, msg) {
                clearInterval(interval);
                validacionRealizada = true;
                enlaceFinal = link;
                timerEl.style.display = 'none';
                errorEl.style.display = 'none';
                showSuccess(msg);
                habilitarBoton();
                btnEl.innerText = '🚀 Abrir enlace ahora';
                box.className = 'ad-pass done';
                box.innerHTML = `<div class="ad-pass-h"><div class="ad-pass-ic" style="background:var(--neon-green)">✓</div><div><b>Acceso directo activo</b><small>Toca “Abrir enlace ahora”. Podrás volver a esta publicación sin esperas.</small></div></div>`;
                mostrarSiguienteParte(juegoId);
            }

            if (!token) {
                box.innerHTML = cabecera() + `<div class="ad-pass-btns"><button class="ad-pass-btn card" onclick="location.href='../index.html'">Inicia sesión para usar el acceso directo</button></div>`;
                return;
            }
            box.innerHTML = cabecera() + '<div class="ad-pass-btns"><button class="ad-pass-btn card" disabled>Cargando…</button></div>';
            const api = async (path, opts = {}) => {
                const r = await fetch(API_URL + path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: opts.body ? JSON.stringify(opts.body) : undefined });
                const d = await r.json().catch(() => ({}));
                if (!r.ok || d.success === false) { const e = new Error(d.error || 'Error de conexión'); e.status = r.status; e.data = d; throw e; }
                return d;
            };
            api(`/acceso-directo/${encodeURIComponent(juegoId)}`).then(est => {
                if (est.desbloqueado && est.link) return listo(est.link, '✅ Ya tienes acceso directo a esta publicación');
                const conMonedas = est.monedas >= est.precioMonedas;
                box.innerHTML = cabecera() + `<div class="ad-pass-btns">
                    <button class="ad-pass-btn card" id="ad-pay-card">💳 Pagar US$1 con tarjeta</button>
                    ${conMonedas ? `<button class="ad-pass-btn coins" id="ad-pay-coins">🪙 Usar ${est.precioMonedas} monedas (tienes ${est.monedas})</button>` : ''}
                    <div id="ad-pay-area"></div></div>` + nota;
                document.getElementById('ad-pay-card').onclick = () => {
                    document.getElementById('ad-pay-card').style.display = 'none';
                    const area = document.getElementById('ad-pay-area');
                    const montar = () => window.UGPagos.botones(area, {
                        crearOrden: async () => (await api(`/acceso-directo/${encodeURIComponent(juegoId)}/orden`, { method: 'POST' })).orderID,
                        capturar: orderID => api(`/acceso-directo/${encodeURIComponent(juegoId)}/capturar`, { method: 'POST', body: { orderID } }),
                        alExito: d => listo(d.link, '✅ ¡Pago confirmado! Enlace desbloqueado'),
                        alError: msg => showError('❌ ' + msg),
                    });
                    window.UGPagos ? montar() : window.addEventListener('load', montar, { once: true });
                };
                const bc = document.getElementById('ad-pay-coins');
                if (bc) bc.onclick = async () => {
                    bc.disabled = true; bc.innerText = 'Procesando…';
                    try { const d = await api(`/acceso-directo/${encodeURIComponent(juegoId)}/monedas`, { method: 'POST' }); listo(d.link, '✅ Enlace desbloqueado con monedas'); }
                    catch (e) { showError('❌ ' + e.message); bc.disabled = false; bc.innerText = `🪙 Usar ${est.precioMonedas} monedas`; }
                };
            }).catch(e => {
                if (e.status === 404) { box.style.display = 'none'; return; }   // publicación no disponible: el flujo normal informa
                box.innerHTML = cabecera() + `<div class="ad-pass-note">No se pudo cargar el acceso directo (${esc(e.message)}). Puedes esperar el contador.</div>`;
            });
        })();

const nextB = document.getElementById('btg-next');
