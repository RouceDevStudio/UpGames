# Compila APEX GP (games/monoplaza) como app Android con Capacitor.
# - Siempre sube el APK como artefacto del workflow.
# - En main, además publica/actualiza la versión "apex-gp-latest" con el APK para descargarlo.
# - Si existen los secretos APEX_KEYSTORE_BASE64, APEX_KEYSTORE_PASSWORD, APEX_KEY_ALIAS y
#   APEX_KEY_PASSWORD, compila la versión de publicación firmada; si no, una de depuración
#   (instalable a mano igualmente).
name: APK APEX GP

on:
  push:
    paths:
      - 'games/monoplaza/**'
      - 'apps/apex-gp-android/**'
      - '.github/workflows/apk-monoplaza.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-monoplaza-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/apex-gp-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # el runner ya trae el SDK de Android; solo se añade la plataforma que usa el proyecto
      - name: SDK de Android
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Pruebas de físicas (sin gráficos)
        working-directory: games/monoplaza
        run: |
          node tools/prueba-fisica.mjs 3 0.98
          node tools/prueba-carrera.mjs 2

      - name: Dependencias y copia del juego
        run: |
          npm install --no-audit --no-fund
          npm run sync

      - name: Compilar APK
        env:
          KS: ${{ secrets.APEX_KEYSTORE_BASE64 }}
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/apex.keystore"
            export APEX_KEYSTORE="$RUNNER_TEMP/apex.keystore"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/APEX-GP.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/APEX-GP.apk"
          fi
          ls -la "$RUNNER_TEMP/APEX-GP.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: APEX-GP-apk
          path: ${{ runner.temp }}/APEX-GP.apk
          if-no-files-found: error

      - name: Publicar en Releases (solo main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apex-gp-latest
          name: APEX GP (Android)
          body: |
            APK de APEX GP, el simulador de monoplazas de UpGames.
            Descárgalo en el teléfono y ábrelo para instalarlo (Android pedirá permitir instalar apps de esta fuente).
            Compilado desde ${{ github.sha }}.
          files: ${{ runner.temp }}/APEX-GP.apk
          make_latest: false
