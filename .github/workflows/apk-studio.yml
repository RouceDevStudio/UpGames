# Compila UpGames Studio (games/studio) como app Android con Capacitor.
# - Siempre sube el APK como artefacto del workflow.
# - En main, además publica/actualiza la versión "studio-latest" con el APK para descargarlo.
# - Si existen los secretos STUDIO_KEYSTORE_BASE64, STUDIO_KEYSTORE_PASSWORD, STUDIO_KEY_ALIAS y
#   STUDIO_KEY_PASSWORD, compila la versión firmada; si no, una de depuración (instalable a mano).
name: APK UpGames Studio

on:
  push:
    paths:
      - 'games/studio/**'
      - 'apps/upgames-studio-android/**'
      - '.github/workflows/apk-studio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/upgames-studio-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: SDK de Android
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Pruebas de Studio (mallas, archivos, operaciones)
        working-directory: .
        run: node test/studio.test.mjs

      - name: Dependencias y copia de Studio
        run: |
          npm install --no-audit --no-fund
          npm run sync

      - name: Compilar APK
        env:
          KS: ${{ secrets.STUDIO_KEYSTORE_BASE64 }}
          STUDIO_KEYSTORE_PASSWORD: ${{ secrets.STUDIO_KEYSTORE_PASSWORD }}
          STUDIO_KEY_ALIAS: ${{ secrets.STUDIO_KEY_ALIAS }}
          STUDIO_KEY_PASSWORD: ${{ secrets.STUDIO_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/studio.keystore"
            export STUDIO_KEYSTORE="$RUNNER_TEMP/studio.keystore"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/UpGames-Studio.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/UpGames-Studio.apk"
          fi
          ls -la "$RUNNER_TEMP/UpGames-Studio.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: UpGames-Studio-apk
          path: ${{ runner.temp }}/UpGames-Studio.apk
          if-no-files-found: error

      - name: Publicar en Releases (solo main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-latest
          name: UpGames Studio (Android)
          body: |
            APK de UpGames Studio: modelado 3D, animación y juegos desde el móvil.
            Descárgalo en el teléfono y ábrelo para instalarlo (Android pedirá permitir instalar apps de esta fuente).
            Compilado desde ${{ github.sha }}.
          files: ${{ runner.temp }}/UpGames-Studio.apk
          make_latest: false
